<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Abstract Mobile UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(160deg, #5a5a70 0%, #8a6070 50%, #c07080 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .scene { display: flex; gap: 36px; flex-wrap: wrap; justify-content: center; }
    .phone {
      width: 280px;
      height: 580px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 0 6px rgba(255,255,255,0.08);
      position: relative;
      color: #fff;
    }

    /* LEFT */
    .phone.left {
      background: linear-gradient(180deg, #f0a040 0%, #e07040 25%, #2080a0 55%, #0a3040 100%);
    }
    .phone.left .hdr {
      padding: 22px 18px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .phone.left .hdr h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      max-width: 70%;
      line-height: 1.25;
    }
    .phone.left .play {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: grid; place-items: center;
      font-size: 12px;
    }
    .abstract {
      position: absolute;
      inset: 15% 0 22%;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(0.5px);
    }
    .b1 { width: 160px; height: 160px; left: -20px; top: 20%;
      background: radial-gradient(circle at 30% 30%, #50e0d0, #3070c0 60%, #203080);
      border-radius: 40% 60% 50% 50%; }
    .b2 { width: 120px; height: 120px; right: -10px; top: 10%;
      background: radial-gradient(circle at 40% 40%, #ff8060, #e04080 70%);
      border-radius: 50%; }
    .b3 { width: 90px; height: 90px; left: 30%; top: 5%;
      background: radial-gradient(circle, #a070ff, #5040c0);
      opacity: 0.85; }
    .b4 { width: 200px; height: 140px; left: 10%; bottom: 5%;
      background: conic-gradient(from 200deg, #f0a020, #e05030, #8050c0, #2080b0, #f0a020);
      border-radius: 40% 60% 50% 50%;
      filter: blur(1px); }
    .dots span {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.5;
    }
    .phone.left .foot {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 18px 22px;
      background: linear-gradient(180deg, transparent, rgba(5,20,30,0.85));
      z-index: 2;
    }
    .phone.left .foot .stat {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .phone.left .foot .stat small {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.7;
      margin-left: 6px;
    }
    .dots-nav {
      display: flex;
      gap: 8px;
    }
    .dots-nav i {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: block;
    }

    /* RIGHT */
    .phone.right {
      background: linear-gradient(165deg, #e8a888 0%, #c07090 30%, #2a2040 65%, #101018 100%);
    }
    .phone.right .hdr {
      padding: 22px 18px 8px;
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 2;
      font-size: 13px;
      font-weight: 600;
    }
    .ribbon {
      position: absolute;
      top: 12%;
      right: -10%;
      width: 90%;
      height: 50%;
      background: linear-gradient(120deg, #ff6040, #c040a0 40%, #6040e0 70%, #2080e0);
      border-radius: 50% 40% 60% 40%;
      transform: rotate(-25deg);
      filter: blur(0.5px);
      opacity: 0.95;
      box-shadow: 0 20px 60px rgba(100,40,150,0.4);
    }
    .spheres .s {
      position: absolute;
      border-radius: 50%;
      box-shadow: inset -8px -8px 20px rgba(0,0,0,0.25), 0 10px 30px rgba(0,0,0,0.2);
    }
    .s1 { width: 70px; height: 70px; right: 18%; top: 22%;
      background: radial-gradient(circle at 35% 30%, #ffb090, #e05040 70%); }
    .s2 { width: 90px; height: 90px; right: 28%; top: 38%;
      background: radial-gradient(circle at 35% 30%, #60e0f0, #2080c0 70%); }
    .s3 { width: 48px; height: 48px; right: 12%; top: 48%;
      background: radial-gradient(circle at 35% 30%, #ffe080, #f0a020 70%); }
    .s4 { width: 40px; height: 40px; left: 20%; top: 42%;
      background: radial-gradient(circle at 35% 30%, #d0a0ff, #7040c0 70%); }
    .phone.right .panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 18px 22px;
      background: linear-gradient(180deg, transparent, rgba(10,10,18,0.95) 30%);
      z-index: 2;
    }
    .phone.right .panel h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .row-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .row-btns span {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 11px;
      font-weight: 600;
    }
    .side-stack {
      position: absolute;
      right: 14px;
      top: 45%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 3;
    }
    .side-stack i {
      width: 40px; height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .side-stack .a { background: #30d0c0; color: #063; }
    .side-stack .b { background: #8060f0; color: #fff; }
    .side-stack .c { background: #f09040; color: #fff; }
    .card-dark {
      background: rgba(20,20,30,0.85);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .card-dark .n { font-size: 18px; font-weight: 700; }
    .card-dark .l { font-size: 10px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="phone left">
      <div class="hdr">
        <h1>Goipovu Minoefnl Dea</h1>
        <div class="play">▶</div>
      </div>
      <div class="abstract">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="blob b4"></div>
        <div class="dots">
          <span style="left:20%;top:15%;background:#60f0e0"></span>
          <span style="left:70%;top:25%;background:#f060a0"></span>
          <span style="left:45%;top:40%;background:#a080ff"></span>
          <span style="left:80%;top:55%;background:#f0c040"></span>
        </div>
      </div>
      <div class="foot">
        <div class="stat">229 <small>points</small></div>
        <div class="dots-nav">
          <i style="background:#f09040"></i>
          <i style="background:#30d0c0"></i>
          <i style="background:#f07050"></i>
          <i style="background:#e08060"></i>
        </div>
      </div>
    </div>

    <div class="phone right">
      <div class="hdr">
        <span>☰  Lojiuare</span>
        <span>···</span>
      </div>
      <div class="ribbon"></div>
      <div class="spheres">
        <div class="s s1"></div>
        <div class="s s2"></div>
        <div class="s s3"></div>
        <div class="s s4"></div>
      </div>
      <div class="side-stack">
        <i class="a">≡</i>
        <i class="b">328</i>
        <i class="c">327</i>
      </div>
      <div class="panel">
        <h2>Aqreapbang</h2>
        <div class="row-btns">
          <span>Primary</span>
          <span>Discover</span>
        </div>
        <div class="card-dark">
          <div>
            <div class="n">Sope</div>
            <div class="l">2.0 · active</div>
          </div>
          <div style="opacity:0.5">›</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
