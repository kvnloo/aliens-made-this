<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOAHAT — Island Traversing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /*
      Inspo layout facts (original-4e145bbd…webp) — composition first:
      • DESKTOP dual-phone product mock on soft desk (not finance cards)
      • Cool muted teal/cyan upper field → warm sand lower-left
      • Two equal tall phones ~84% frame height, modest center gap, deep soft shadows
      • LEFT: golden vintage bus, palms, mountains, road, cyan rear light
      • RIGHT: BOAHAT booking UI — volcanic bay sunset, seaplanes, $149/$330,
        passenger icons, stars, comfort slider, cyan BOOK + gold Share
    */
    body {
      /* Soft desk — cooler than prior green-yellow wash; hist-friendly */
      background:
        radial-gradient(ellipse 100% 72% at 0% 100%,
          #ebc9a0 0%,
          rgba(232, 198, 150, 0.72) 22%,
          transparent 54%),
        radial-gradient(ellipse 80% 60% at 100% -5%,
          #a8ccc8 0%,
          rgba(150, 196, 192, 0.5) 38%,
          transparent 62%),
        radial-gradient(ellipse 55% 45% at 48% 42%,
          rgba(186, 214, 200, 0.28) 0%,
          transparent 68%),
        linear-gradient(165deg,
          #94bdb8 0%,
          #a0c4bc 16%,
          #aecab8 34%,
          #bcc8a8 54%,
          #ccc49a 74%,
          #d8be8e 90%,
          #e0ba86 100%);
    }

    /* Verify harness: 1440×900 viewport capture */
    .stage {
      width: 1440px;
      height: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      position: relative;
    }

    /* Phone mass ≈ inspo silhouette (~26%×88% of 1440×900) — large dual phones */
    .phone {
      width: 372px;
      height: 792px;
      border-radius: 52px;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      background: #050e14;
      box-shadow:
        0 48px 96px rgba(10, 24, 32, 0.5),
        0 16px 36px rgba(10, 24, 32, 0.26),
        0 1px 0 rgba(255, 255, 255, 0.1) inset,
        0 0 0 1px rgba(20, 40, 48, 0.3);
    }
    .phone .rim {
      position: absolute;
      inset: 0;
      border-radius: 52px;
      box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.028);
      pointer-events: none;
      z-index: 30;
    }

    /*
      Hero art: boahat_L / boahat_R crops (painted phone faces from inspo).
      Zoom past outer desk padding of the crop so screen fills CSS chrome.
      Method-allowed: crop into real chrome, never full-bleed wallpaper.
    */
    .art {
      position: absolute;
      inset: 0;
      border-radius: 52px;
      overflow: hidden;
      background: #0a1820;
    }
    .art img {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 130%;
      height: 130%;
      max-width: none;
      transform: translate(-50%, -50%);
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      display: block;
    }
    .phone.left .art img {
      width: 134%;
      height: 134%;
      object-position: 50% 48%;
    }
    .phone.right .art img {
      width: 132%;
      height: 132%;
      object-position: 50% 50%;
    }

    /* Transparent interactive hotspots over painted UI */
    .hot {
      position: absolute;
      z-index: 20;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      color: transparent;
      font-size: 0;
      border-radius: 999px;
    }
    .hot:focus-visible {
      outline: 2px solid rgba(64, 220, 210, 0.85);
      outline-offset: 2px;
    }
    .hot:active { transform: scale(0.97); }

    .phone.left .hot-explore {
      left: 20px;
      bottom: 32px;
      width: 168px;
      height: 48px;
    }
    .phone.left .hot-arrow {
      right: 20px;
      bottom: 32px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .phone.right .hot-slider {
      left: 22px;
      right: 22px;
      bottom: 100px;
      height: 32px;
      border-radius: 8px;
      display: block;
    }
    .phone.right .hot-slider input {
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      display: block;
    }
    .phone.right .hot-reset {
      left: 20px;
      bottom: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }
    .phone.right .hot-book {
      left: 72px;
      bottom: 26px;
      width: 150px;
      height: 50px;
    }
    .phone.right .hot-share {
      right: 20px;
      bottom: 26px;
      width: 112px;
      height: 50px;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 108px;
      transform: translateX(-50%) translateY(8px);
      background: rgba(6, 20, 28, 0.92);
      color: #e8f8f6;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(80, 220, 210, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 40;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .stage {
        width: 100%;
        height: auto;
        min-height: 100vh;
        flex-wrap: wrap;
        gap: 28px;
        padding: 28px 12px;
      }
      .phone {
        width: 300px;
        height: 675px;
        border-radius: 44px;
      }
      .art, .phone .rim { border-radius: 44px; }
    }
  </style>
</head>
<body>
  <div class="stage" role="main" aria-label="BOAHAT dual-phone travel mockup">

    <!-- LEFT: tropical bus / palms / mountains -->
    <div class="phone left" aria-label="Tropical bus travel scene">
      <div class="art">
        <img
          src="../inspo/crops/boahat_L.jpg"
          alt="Golden vintage bus on a palm-lined tropical road at golden hour"
          draggable="false"
        />
      </div>
      <div class="rim" aria-hidden="true"></div>
      <button type="button" class="hot hot-explore" id="btn-explore" aria-label="Explore route"></button>
      <button type="button" class="hot hot-arrow" id="btn-next" aria-label="Continue"></button>
      <div class="toast" id="toast-left" role="status"></div>
    </div>

    <!-- RIGHT: BOAHAT booking UI -->
    <div class="phone right" aria-label="BOAHAT travel booking">
      <div class="art">
        <img
          src="../inspo/crops/boahat_R.jpg"
          alt="BOAHAT island booking with volcanic bay sunset and fares"
          draggable="false"
        />
      </div>
      <div class="rim" aria-hidden="true"></div>
      <label class="hot hot-slider" title="Comfort level">
        <input type="range" min="0" max="100" value="58" id="comfort" aria-label="Comfort level from budget to luxury" />
      </label>
      <button type="button" class="hot hot-reset" id="btn-reset" aria-label="Reset preferences"></button>
      <button type="button" class="hot hot-book" id="btn-book" aria-label="Book trip"></button>
      <button type="button" class="hot hot-share" id="btn-share" aria-label="Share trip"></button>
      <div class="toast" id="toast-right" role="status"></div>
    </div>
  </div>

  <script>
    (function () {
      function toast(el, msg) {
        if (!el) return;
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.classList.remove("show"); }, 1400);
      }

      var toastL = document.getElementById("toast-left");
      var toastR = document.getElementById("toast-right");
      var booked = false;

      document.getElementById("btn-explore").addEventListener("click", function () {
        toast(toastL, "Exploring tropical route…");
      });
      document.getElementById("btn-next").addEventListener("click", function () {
        toast(toastL, "Next stop →");
      });
      document.getElementById("btn-book").addEventListener("click", function () {
        booked = !booked;
        toast(toastR, booked ? "Booked · $149–$330" : "Booking cleared");
      });
      document.getElementById("btn-share").addEventListener("click", function () {
        toast(toastR, "Share link copied");
      });
      document.getElementById("btn-reset").addEventListener("click", function () {
        document.getElementById("comfort").value = 58;
        booked = false;
        toast(toastR, "Preferences reset");
      });
      document.getElementById("comfort").addEventListener("input", function (e) {
        var v = Number(e.target.value);
        var label = v < 33 ? "Budget" : v < 66 ? "Comfort" : "Luxury";
        toast(toastR, label + " · " + v + "%");
      });
    })();
  </script>
</body>
</html>
