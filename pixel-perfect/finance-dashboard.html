<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOAHAT — Travel Pair</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      /* Soft teal → mint → warm sand desk backdrop matching inspo */
      background:
        radial-gradient(ellipse 70% 55% at 8% 92%, rgba(236, 200, 140, 0.72) 0%, transparent 58%),
        radial-gradient(ellipse 55% 45% at 95% 8%, rgba(150, 205, 200, 0.55) 0%, transparent 52%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(200, 230, 220, 0.35) 0%, transparent 70%),
        linear-gradient(168deg,
          #8ebfb8 0%,
          #9cc9c2 18%,
          #a8d0c6 38%,
          #b8d4c0 58%,
          #c8d4b0 78%,
          #dcc9a0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      overflow: hidden;
    }

    .scene {
      display: flex;
      gap: 36px;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      transform: scale(1);
    }

    /* Phone chassis — tall premium frames like inspo */
    .phone {
      width: 300px;
      height: 630px;
      border-radius: 44px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 42px 90px rgba(12, 32, 40, 0.42),
        0 14px 32px rgba(12, 32, 40, 0.22),
        0 0 0 1px rgba(255, 255, 255, 0.14),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.1);
      background: #061018;
      flex-shrink: 0;
    }
    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 44px;
      box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.055);
      pointer-events: none;
      z-index: 40;
    }
    .phone::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 78px;
      height: 7px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.4);
      z-index: 41;
    }

    /* ========== LEFT PHONE ========== */
    .phone.left { background: #142830; }
    .phone.left .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .left-ui {
      position: absolute;
      bottom: 24px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .left-ui .chip {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(6, 16, 22, 0.48);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .left-ui .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ee0d8;
      box-shadow: 0 0 10px #4ee0d8;
    }
    .left-ui .chip-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(6, 16, 22, 0.48);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
    }

    /* ========== RIGHT PHONE ========== */
    .phone.right {
      background: #05141c;
      display: flex;
      flex-direction: column;
    }
    .r-hero {
      position: relative;
      height: 52%;
      flex-shrink: 0;
      overflow: hidden;
    }
    .r-hero .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .r-nav {
      position: absolute;
      top: 26px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      color: rgba(255, 255, 255, 0.92);
    }
    .r-nav .icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      opacity: 0.92;
      text-shadow: 0 1px 6px rgba(0,0,0,0.35);
    }
    .r-title-block {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .r-title-block .eyebrow {
      font-size: 8.5px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      font-weight: 500;
      margin-bottom: 5px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.35);
    }
    .r-title-block h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.24em;
      color: #fff;
      text-shadow:
        0 4px 28px rgba(0, 0, 0, 0.5),
        0 1px 0 rgba(255, 220, 160, 0.35),
        0 0 40px rgba(255, 200, 120, 0.25);
    }
    .r-title-block .sub {
      font-size: 8px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(255, 240, 210, 0.7);
      margin-top: 4px;
    }

    .r-body {
      flex: 1;
      background: linear-gradient(180deg, #0a2834 0%, #071c26 35%, #05141c 100%);
      padding: 12px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      position: relative;
      z-index: 5;
    }
    .r-body::before {
      content: "";
      position: absolute;
      top: -32px;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(180deg, transparent, #0a2834);
      pointer-events: none;
    }

    .prices {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      position: relative;
      z-index: 1;
    }
    .price-col { flex: 1; text-align: center; }
    .price-col .amt {
      font-size: 26px;
      font-weight: 700;
      color: #e8c878;
      letter-spacing: 0.02em;
      text-shadow: 0 0 22px rgba(232, 200, 120, 0.3);
    }
    .price-col .amt span {
      font-size: 15px;
      font-weight: 600;
      opacity: 0.88;
      margin-right: 1px;
    }
    .price-col .lbl {
      font-size: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6a9098;
      margin-top: 3px;
      font-weight: 500;
    }
    .price-col .meta {
      font-size: 7.5px;
      color: #4a7078;
      margin-top: 2px;
    }
    .price-divider {
      width: 1px;
      background: linear-gradient(180deg, transparent, #2a4850, transparent);
      margin: 0 6px;
    }

    .pax-row {
      display: flex;
      justify-content: space-around;
      padding: 0 14px;
    }
    .pax {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .pax i {
      display: block;
      width: 9px;
      height: 14px;
      position: relative;
    }
    .pax i::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c8a860;
    }
    .pax i::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 7px;
      border-radius: 3px 3px 2px 2px;
      background: #c8a860;
    }
    .pax.dim i::before,
    .pax.dim i::after,
    .pax i.dim::before,
    .pax i.dim::after {
      background: #3a5858;
    }

    .stars-row {
      display: flex;
      justify-content: space-around;
      padding: 0 20px;
      font-size: 10px;
      letter-spacing: 1.5px;
    }
    .stars-row .s { color: #d4b060; }
    .stars-row .s.dim { color: #2a4048; }

    .slider-block { padding: 2px 4px 0; }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 7px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4a7078;
      margin-bottom: 7px;
      padding: 0 2px;
    }
    .slider {
      height: 4px;
      background: #143038;
      border-radius: 3px;
      position: relative;
    }
    .slider .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 58%;
      border-radius: 3px;
      background: linear-gradient(90deg, #2ad0d0, #e0c068);
      box-shadow: 0 0 12px rgba(42, 208, 208, 0.4);
    }
    .slider .knob {
      position: absolute;
      left: 58%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 14px rgba(80, 220, 220, 0.6), 0 2px 6px rgba(0, 0, 0, 0.35);
      border: 2px solid #c8e8e8;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 2px;
      align-items: center;
    }
    .actions .side-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .actions .ico {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(60, 200, 200, 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4ad0d0;
      font-size: 13px;
      background: rgba(20, 50, 58, 0.55);
    }
    .btn-book {
      flex: 1;
      height: 42px;
      border-radius: 24px;
      background: transparent;
      border: 1.5px solid #3ae0d8;
      color: #5ee8e0;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(58, 224, 216, 0.2);
      font-family: inherit;
    }
    .btn-share {
      height: 42px;
      padding: 0 20px;
      border: none;
      border-radius: 24px;
      background: linear-gradient(135deg, #e8c878 0%, #d4a848 55%, #c89838 100%);
      color: #1a1808;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(200, 150, 50, 0.38);
      font-family: inherit;
    }

    @media (max-width: 700px) {
      .scene { gap: 18px; transform: scale(0.72); }
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="scene">

    <!-- ================= LEFT: tropical bus scene ================= -->
    <div class="phone left" aria-label="Tropical bus travel scene">
      <svg class="art" viewBox="0 0 300 630" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="Lsky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0e3540"/>
            <stop offset="12%" stop-color="#1a4e5c"/>
            <stop offset="28%" stop-color="#3a7a88"/>
            <stop offset="42%" stop-color="#8ab0a0"/>
            <stop offset="55%" stop-color="#d4c090"/>
            <stop offset="70%" stop-color="#e8d0a0"/>
            <stop offset="100%" stop-color="#c8a868"/>
          </linearGradient>
          <radialGradient id="Lsun" cx="40%" cy="36%" r="32%">
            <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.98"/>
            <stop offset="22%" stop-color="#ffe8b0" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#f0c878" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#e8c080" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="Lmtn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9ab0a0"/>
            <stop offset="45%" stop-color="#5a7868"/>
            <stop offset="100%" stop-color="#2a4838"/>
          </linearGradient>
          <linearGradient id="Lmtn2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6a8878"/>
            <stop offset="100%" stop-color="#1e3828"/>
          </linearGradient>
          <linearGradient id="Lroad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4a4a46"/>
            <stop offset="35%" stop-color="#343432"/>
            <stop offset="100%" stop-color="#161614"/>
          </linearGradient>
          <linearGradient id="LbusBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0dcb0"/>
            <stop offset="20%" stop-color="#e0c888"/>
            <stop offset="50%" stop-color="#c8a858"/>
            <stop offset="80%" stop-color="#a88840"/>
            <stop offset="100%" stop-color="#8a6c30"/>
          </linearGradient>
          <linearGradient id="LbusSide" x1="0" y1="0" x2="1" y2="0.3">
            <stop offset="0%" stop-color="#8a6c38"/>
            <stop offset="35%" stop-color="#c8a860"/>
            <stop offset="70%" stop-color="#e8d090"/>
            <stop offset="100%" stop-color="#f0e0b0"/>
          </linearGradient>
          <linearGradient id="Lglass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7ab8c8"/>
            <stop offset="40%" stop-color="#3a7088"/>
            <stop offset="100%" stop-color="#1a3848"/>
          </linearGradient>
          <linearGradient id="Lcyan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#80ffff"/>
            <stop offset="40%" stop-color="#40e0e8"/>
            <stop offset="100%" stop-color="#1890a0"/>
          </linearGradient>
          <linearGradient id="Lpalm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0e2820"/>
            <stop offset="100%" stop-color="#061410"/>
          </linearGradient>
          <linearGradient id="Lleaf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2a5840"/>
            <stop offset="40%" stop-color="#1a3a28"/>
            <stop offset="100%" stop-color="#0a1c14"/>
          </linearGradient>
          <linearGradient id="Ltrunk" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3a2818"/>
            <stop offset="40%" stop-color="#6a4a30"/>
            <stop offset="70%" stop-color="#8a6840"/>
            <stop offset="100%" stop-color="#5a3c28"/>
          </linearGradient>
          <filter id="Lsoft" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2"/>
          </filter>
          <filter id="Lglow">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="Lblur3"><feGaussianBlur stdDeviation="3"/></filter>
          <radialGradient id="Lhaze" cx="50%" cy="55%" r="50%">
            <stop offset="0%" stop-color="#f0e0b0" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#c8b080" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Sky base -->
        <rect width="300" height="630" fill="url(#Lsky)"/>
        <rect width="300" height="630" fill="url(#Lsun)"/>
        <ellipse cx="120" cy="230" rx="140" ry="90" fill="url(#Lhaze)"/>

        <!-- Distant mountain range -->

              fill="url(#Lmtn)" opacity="0.5"/>

              fill="url(#Lmtn2)" opacity="0.72"/>
        <path d="M0 370 L60 330 L110 355 L160 300 L220 345 L300 320 L300 430 L0 430 Z"
              fill="#1a3028" opacity="0.55"/>

        <!-- Jungle mid haze -->

        <!-- RIGHT corner palm fronds -->

          <path d="M285 158 Q240 172 200 162" fill="none" stroke="#0a1814" stroke-width="8" stroke-linecap="round"/>
        </g>

        <!-- Tall center-left palm -->
        <g>
          <path d="M125 450 Q128 320 134 200 Q136 140 138 95" fill="none" stroke="url(#Ltrunk)" stroke-width="11" stroke-linecap="round"/>
          <path d="M128 450 Q131 320 136 200 Q138 140 140 98" fill="none" stroke="#a88858" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
          <!-- trunk rings -->
          <g stroke="#3a2818" stroke-width="1.2" opacity="0.35">
            <path d="M123 200 Q134 198 141 202"/>
            <path d="M124 240 Q135 238 142 242"/>
            <path d="M124 280 Q135 278 142 282"/>
            <path d="M123 320 Q134 318 141 322"/>

          </g>
          <!-- crown -->
          <g fill="url(#Lleaf)">
            <path d="M138 100 Q90 70 45 100 Q85 85 108 105 Q70 95 35 125 Q90 100 120 115 Z"/>
            <path d="M138 95 Q100 40 65 15 Q110 50 130 80 Q100 35 88 5 Q125 45 140 85 Z"/>

          <g fill="#3a7050" opacity="0.32">
            <path d="M138 95 Q115 50 92 32 Q118 60 134 90 Z"/>

        </g>

        <!-- Mid-left palm -->
        <g opacity="0.88">
          <path d="M52 430 Q55 340 60 265 Q62 225 64 195" fill="none" stroke="#4a3424" stroke-width="7" stroke-linecap="round"/>
          <path d="M64 200 Q35 165 12 178 Q42 172 54 195 Q25 175 8 192 Q38 182 60 205 Z" fill="#152820"/>
          <path d="M64 198 Q82 155 108 148 Q82 172 72 195 Q100 158 122 158 Q92 178 68 205 Z" fill="#1a3028"/>

        </g>

        <!-- Mid-right palm -->
        <g opacity="0.85">
          <path d="M235 440 Q240 350 246 285 Q248 245 250 210" fill="none" stroke="#4a3424" stroke-width="8" stroke-linecap="round"/>
          <path d="M250 215 Q222 175 195 182 Q222 188 234 210 Q205 180 182 198 Q218 190 246 220 Z" fill="#152820"/>
          <path d="M251 212 Q275 165 298 158 Q272 182 258 210 Q285 168 305 168 Q275 190 254 218 Z" fill="#1a3028"/>
          <path d="M250 222 Q268 250 285 290 Q265 250 255 235 Q272 268 290 305 Q262 260 252 238 Z" fill="#12241c"/>
        </g>

        <!-- Far palm silhouettes -->
        <g fill="#243830" opacity="0.5">
          <ellipse cx="180" cy="365" rx="7" ry="24"/>
          <path d="M180 345 Q162 328 150 334 Q168 332 177 348 Q192 328 205 336 Q188 334 183 350 Z"/>
          <ellipse cx="95" cy="372" rx="5.5" ry="18"/>
          <path d="M95 356 Q82 342 72 348 Q86 346 93 358 Q106 342 116 350 Q102 348 97 362 Z"/>
          <ellipse cx="210" cy="370" rx="5" ry="16"/>
          <path d="M210 356 Q198 344 190 348 Q202 348 208 358 Q218 344 226 350 Q214 348 212 360 Z"/>
        </g>

        <!-- Hay bales left roadside -->
        <ellipse cx="42" cy="448" rx="24" ry="15" fill="#8a6840" opacity="0.9"/>
        <ellipse cx="42" cy="440" rx="20" ry="11" fill="#c4a060" opacity="0.75"/>
        <ellipse cx="42" cy="434" rx="16" ry="8" fill="#d4b878" opacity="0.55"/>
        <ellipse cx="68" cy="452" rx="15" ry="11" fill="#7a5830" opacity="0.8"/>
        <ellipse cx="68" cy="446" rx="12" ry="7" fill="#a88848" opacity="0.6"/>
        <!-- straw texture lines -->
        <g stroke="#6a4828" stroke-width="0.8" opacity="0.35">
