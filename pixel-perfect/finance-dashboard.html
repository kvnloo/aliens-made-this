<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOAHAT Travel Pair</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(160deg, #c8ddd8 0%, #a8c8c0 40%, #e8d8c0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .scene { display: flex; gap: 36px; flex-wrap: wrap; justify-content: center; }
    .phone {
      width: 280px;
      height: 580px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 36px 70px rgba(20,40,50,0.35), 0 0 0 8px rgba(255,255,255,0.2);
      position: relative;
      color: #fff;
    }

    /* LEFT — bus scene */
    .phone.left {
      background:
        linear-gradient(180deg, rgba(10,30,40,0.15) 0%, rgba(10,30,40,0.55) 70%, rgba(10,20,30,0.85) 100%),
        radial-gradient(ellipse 80% 50% at 50% 30%, #f5e0a8 0%, #88b8b0 40%, #2a5a60 100%);
    }
    .phone.left .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 70% 25%, rgba(255,240,200,0.9) 0%, transparent 25%),
        linear-gradient(180deg, #5a9aaa 0%, #8ab8a8 35%, #c8b898 70%, #3a5a50 100%);
    }
    .phone.left .palms {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 30% 50% at 15% 40%, #1a4030 0%, transparent 70%),
        radial-gradient(ellipse 35% 55% at 85% 35%, #1a4038 0%, transparent 70%);
      opacity: 0.9;
    }
    .phone.left .palm-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .phone.left .bus {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 28%;
      background: linear-gradient(180deg, #d4b878 0%, #c4a060 40%, #a88848 100%);
      border-radius: 40% 40% 18% 18% / 55% 55% 30% 30%;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .phone.left .bus::before {
      content: "";
      position: absolute;
      top: 28%;
      left: 12%;
      right: 28%;
      height: 22%;
      background: linear-gradient(90deg, #4a90a0, #6ab0c0 50%, #4a90a0);
      border-radius: 6px;
      opacity: 0.85;
      box-shadow: 0 0 20px rgba(100,200,220,0.5);
    }
    .phone.left .bus::after {
      content: "";
      position: absolute;
      right: 8%;
      top: 35%;
      width: 18%;
      height: 35%;
      background: linear-gradient(180deg, #3ae0e8, #1a90a0);
      border-radius: 4px;
      box-shadow: 0 0 16px rgba(60,220,230,0.6);
    }
    .phone.left .road {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 18%;
      background: linear-gradient(180deg, #4a4a48, #2a2a28);
    }
    .phone.left .road::after {
      content: "";
      position: absolute;
      top: 45%;
      left: 10%;
      right: 10%;
      height: 3px;
      background: repeating-linear-gradient(90deg, #c8c070 0 20px, transparent 20px 36px);
      opacity: 0.7;
    }
    .phone.left .ui-bottom {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      opacity: 0.85;
      z-index: 2;
    }

    /* RIGHT — booking */
    .phone.right {
      background: #0a1a22;
      display: flex;
      flex-direction: column;
    }
    .r-hero {
      height: 55%;
      position: relative;
      background:
        radial-gradient(circle at 20% 45%, rgba(255,200,100,0.5) 0%, transparent 30%),
        linear-gradient(180deg, #4a90a8 0%, #e8b878 40%, #1a4a58 75%, #0a1a22 100%);
      overflow: hidden;
    }
    .r-hero .top {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 2;
      font-size: 14px;
    }
    .r-hero h1 {
      position: absolute;
      top: 48px;
      left: 0; right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-shadow: 0 4px 20px rgba(0,0,0,0.35);
      z-index: 2;
    }
    .r-hero .mtn {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 70%;
    }
    .r-hero .mtn svg { width: 100%; height: 100%; display: block; }
    .r-body {
      flex: 1;
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prices {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .prices .p .amt {
      font-size: 22px;
      font-weight: 700;
      color: #e8d090;
    }
    .prices .p .lbl {
      font-size: 9px;
      color: #6a8a90;
      margin-top: 2px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .stars {
      display: flex;
      justify-content: space-around;
      font-size: 10px;
      color: #c8a860;
      opacity: 0.9;
    }
    .slider {
      height: 4px;
      background: #1a3a42;
      border-radius: 2px;
      position: relative;
      margin: 4px 0;
    }
    .slider::after {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 55%;
      background: linear-gradient(90deg, #3ae0e0, #e8c070);
      border-radius: 2px;
    }
    .slider .knob {
      position: absolute;
      left: 55%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(60,220,220,0.5);
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .actions .ghost {
      background: transparent;
      border: 1px solid #3ae0e0;
      color: #3ae0e0;
    }
    .actions .fill {
      background: linear-gradient(135deg, #e8c070, #d4a040);
      color: #1a2010;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="phone left">
      <div class="sky"></div>
      <svg class="palm-svg" viewBox="0 0 280 580" preserveAspectRatio="xMidYMid slice">
        <ellipse cx="40" cy="200" rx="50" ry="120" fill="#1a4030" opacity="0.5" transform="rotate(-20 40 200)"/>
        <ellipse cx="240" cy="180" rx="55" ry="140" fill="#1a4038" opacity="0.45" transform="rotate(15 240 180)"/>
        <path d="M30 100 Q50 40 90 80 Q60 70 30 100" fill="#2a5840" opacity="0.7"/>
        <path d="M200 90 Q230 20 270 70 Q240 60 200 90" fill="#2a5840" opacity="0.65"/>
        <path d="M0 380 Q140 340 280 380 L280 580 L0 580 Z" fill="#3a5a48" opacity="0.4"/>
      </svg>
      <div class="bus"></div>
      <div class="road"></div>
      <div class="ui-bottom"><span>◎ Explore</span><span>→</span></div>
    </div>

    <div class="phone right">
      <div class="r-hero">
        <div class="top"><span>☰</span><span>‹</span></div>
        <h1>BOAHAT</h1>
        <div class="mtn">
          <svg viewBox="0 0 280 280" preserveAspectRatio="xMidYMax slice">
            <defs>
              <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffe8a0"/>
                <stop offset="100%" stop-color="#ffb050"/>
              </linearGradient>
              <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f5d0a0"/>
                <stop offset="50%" stop-color="#c07050"/>
                <stop offset="100%" stop-color="#3a5060"/>
              </linearGradient>
              <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#4ac0c8"/>
                <stop offset="100%" stop-color="#1a4a58"/>
              </linearGradient>
            </defs>
            <circle cx="50" cy="140" r="28" fill="url(#sun)" opacity="0.9"/>
            <path d="M80 200 L140 60 L200 200 Z" fill="url(#peak)"/>
            <path d="M0 200 L60 140 L100 180 L140 100 L180 160 L220 90 L280 150 L280 280 L0 280 Z" fill="#8a6050" opacity="0.6"/>
            <path d="M0 220 Q70 200 140 210 T280 200 L280 280 L0 280 Z" fill="url(#sea)"/>
            <!-- planes -->
            <g fill="#fff" opacity="0.85">
              <path d="M40 100 l20 4 -8 6 -4-2 -8 4 z"/>
              <path d="M220 90 l20 4 -8 6 -4-2 -8 4 z"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="r-body">
        <div class="prices">
          <div class="p"><div class="amt">$149</div><div class="lbl">Economy</div></div>
          <div class="p"><div class="amt">$330</div><div class="lbl">Premium</div></div>
        </div>
        <div class="stars">
          <span>★ ★ ★ ★ ☆</span>
          <span>★ ★ ★ ★ ★</span>
        </div>
        <div class="slider"><div class="knob"></div></div>
        <div class="actions">
          <button class="ghost" type="button">Details</button>
          <button class="fill" type="button">Book</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
