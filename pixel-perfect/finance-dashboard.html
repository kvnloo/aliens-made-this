<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking Dashboard - BOAHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #7dd3c0 0%, #88d4c0 50%, #a0dbc7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card-shadow {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .card-shadow:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .overlay-gradient {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent 50%);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f4a261 0%, #e76f51 100%);
            box-shadow: 0 4px 15px rgba(244, 162, 97, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(244, 162, 97, 0.6);
            transform: translateY(-2px);
        }

        .glass-effect {
            background: rgba(26, 58, 74, 0.95);
            backdrop-filter: blur(10px);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(125, 211, 192, 0.3);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #7dd3c0;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 2px 10px rgba(125, 211, 192, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #7dd3c0;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 2px 10px rgba(125, 211, 192, 0.5);
        }

        .star-icon {
            color: #f4a261;
        }

        .plane-icon {
            position: absolute;
            color: #264653;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="flex gap-8 max-w-6xl flex-wrap justify-center">
        <!-- Left Card - Vintage Bus Scene -->
        <div class="w-full max-w-sm h-[700px] rounded-[2rem] overflow-hidden card-shadow relative">
            <div class="absolute inset-0 bg-cover bg-center"
                 style="background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=800&auto=format&fit=crop');"></div>
            <div class="absolute inset-0 overlay-gradient"></div>

            <!-- Bottom Info Bar -->
            <div class="absolute bottom-0 left-0 right-0 p-6 glass-effect">
                <div class="flex justify-between items-center text-white">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span class="text-sm font-medium">LUXURY RESORT TOUR</span>
                    </div>
                    <div class="flex gap-3">
                        <button class="w-8 h-8 rounded-full bg-white/20 backdrop-blur flex items-center justify-center hover:bg-white/30 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                            </svg>
                        </button>
                        <button class="w-8 h-8 rounded-full bg-white/20 backdrop-blur flex items-center justify-center hover:bg-white/30 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="mt-4 flex items-center justify-between text-white/80">
                    <span class="text-xs uppercase tracking-wide">5 Days / 6 Nights</span>
                    <span class="text-2xl font-bold">$ 010</span>
                </div>
            </div>
        </div>

        <!-- Right Card - Travel Booking Interface -->
        <div class="w-full max-w-sm h-[700px] rounded-[2rem] overflow-hidden card-shadow relative glass-effect">
            <!-- Header with Menu Icons -->
            <div class="absolute top-6 left-6 right-6 flex justify-between items-center z-10">
                <button class="w-10 h-10 rounded-lg bg-white/10 backdrop-blur flex items-center justify-center text-white hover:bg-white/20 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="flex gap-2">
                    <button class="w-10 h-10 rounded-lg bg-white/10 backdrop-blur flex items-center justify-center text-white hover:bg-white/20 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <button class="w-10 h-10 rounded-lg bg-white/10 backdrop-blur flex items-center justify-center text-white hover:bg-white/20 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Hero Image Section -->
            <div class="relative h-80 overflow-hidden">
                <div class="absolute inset-0 bg-cover bg-center"
                     style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&auto=format&fit=crop');"></div>
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#1a3a4a]"></div>

                <!-- Decorative Planes -->
                <svg class="plane-icon w-12 h-12" style="top: 30%; left: 15%;" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>
                <svg class="plane-icon w-12 h-12" style="top: 35%; right: 15%; transform: scaleX(-1);" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>

                <!-- Location Title -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center">
                    <p class="text-white/70 text-xs uppercase tracking-widest mb-2">TODAY PHULAMGUNG</p>
                    <h1 class="text-white text-5xl font-bold tracking-wide">BOAHAT</h1>
                    <p class="text-white/70 text-sm mt-2 uppercase tracking-wide">PHAMBOUS</p>
                </div>

                <!-- Decorative stars/dots -->
                <div class="absolute top-20 right-20 w-1 h-1 bg-white rounded-full"></div>
                <div class="absolute top-24 right-28 w-1 h-1 bg-white rounded-full"></div>
                <div class="absolute top-28 left-16 w-1 h-1 bg-white rounded-full"></div>
            </div>

            <!-- Content Section -->
            <div class="p-6 space-y-6">
                <!-- Price Comparison -->
                <div class="flex items-center justify-center gap-8">
                    <div class="text-center">
                        <p class="text-cyan-400 text-xs uppercase tracking-wide mb-1">$ 149</p>
                        <p class="text-white/60 text-xs">4 6 HRO</p>
                        <p class="text-white/50 text-[10px] uppercase mt-1">FROM DUNSE OT</p>
                        <p class="text-white/50 text-[10px] uppercase">GULLAX DUMONDR</p>
                    </div>

                    <div class="h-12 w-px bg-white/20"></div>

                    <div class="text-center">
                        <p class="text-cyan-400 text-xs uppercase tracking-wide mb-1">$ 330</p>
                        <p class="text-white/60 text-xs">4 I 00</p>
                        <p class="text-white/50 text-[10px] uppercase mt-1">2OR LUNDRA E</p>
                        <p class="text-white/50 text-[10px] uppercase">GULLA SHOULD A SUEA</p>
                    </div>
                </div>

                <!-- Passenger Icons -->
                <div class="flex justify-center gap-1">
                    <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <svg class="w-6 h-6 text-white/20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>

                <!-- Slider Section -->
                <div class="space-y-3">
                    <div class="flex justify-between text-white text-xs uppercase tracking-wide">
                        <span>4 CHILD AR</span>
                        <span>TOBOITNE</span>
                        <span>ABE 4 CON</span>
                    </div>
                    <input type="range" min="0" max="100" value="70" class="w-full">
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-between pt-4">
                    <div class="flex gap-3">
                        <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center text-cyan-400 hover:bg-white/20 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        </button>
                        <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center text-cyan-400 hover:bg-white/20 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                            </svg>
                        </button>
                        <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur flex items-center justify-center text-cyan-400 hover:bg-white/20 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="text-right">
                        <p class="text-cyan-400 text-xs uppercase tracking-wide mb-1">PRICE</p>
                        <button class="btn-primary text-white px-8 py-3 rounded-full font-semibold text-sm uppercase tracking-wide transition-all">
                            $ 6 N DRK
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
