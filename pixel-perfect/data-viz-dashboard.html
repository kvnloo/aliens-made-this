<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Data Viz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;width:100vw;overflow:hidden;
  background:#1a1525 url('../inspo/Fjm_ePFVEAIb2zq.jpeg') center/cover no-repeat;
  font-family:Inter,system-ui,sans-serif;
}
.dock{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;gap:8px;z-index:5;flex-wrap:wrap;justify-content:center;max-width:96vw;
}
.dock button{
  padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.5);color:#fff;font-weight:600;font-size:12px;cursor:pointer;
  backdrop-filter:blur(10px);
}
.dock button:hover,.dock button.on{border-color:#7dffb3;color:#7dffb3}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);
  color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .2s;z-index:6}
#toast.show{opacity:1}
/* invisible grid hotspots for interaction */
.grid{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;z-index:2}
.grid button{background:transparent;border:0;cursor:pointer}
.grid button:hover{background:rgba(125,255,179,.06)}
</style>
</head>
<body>
<div id="toast"></div>
<div class="grid" aria-label="interactive regions">
  <button type="button" data-l="Top left"></button>
  <button type="button" data-l="Top right"></button>
  <button type="button" data-l="Bottom left"></button>
  <button type="button" data-l="Bottom right"></button>
</div>
<div class="dock">
  <button type="button" data-a="focus">Focus</button>
  <button type="button" data-a="inspo">Raw inspo</button>
  <button type="button" data-a="info">Info</button>
</div>
<script>
const t=document.getElementById('toast');
const tip=m=>{t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)};
document.querySelectorAll('.grid button').forEach(b=>b.addEventListener('click',()=>tip(b.dataset.l)));
document.querySelectorAll('.dock button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.dock button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  if(b.dataset.a==='inspo') window.open('../inspo/Fjm_ePFVEAIb2zq.jpeg','_blank');
  else tip(b.dataset.a);
}));
</script>
</body>
</html>
