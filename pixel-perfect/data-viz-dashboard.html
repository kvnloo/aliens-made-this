<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOLHHACUIND — Ocean HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #02060c;
      --cyan: #2de2e6;
      --cyan-b: #7ef9fc;
      --cyan-d: #1a9aa0;
      --glow: rgba(45, 226, 230, 0.55);
      --text: #d4f7f9;
      --muted: rgba(130, 190, 200, 0.48);
      --glass: rgba(3, 16, 26, 0.62);
      --border: rgba(45, 226, 230, 0.38);
      --border-s: rgba(45, 226, 230, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000204;
      font-family: "Rajdhani", system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse 58% 55% at 50% 48%, #0a1824 0%, #040a12 50%, #000204 100%);
    }
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 15vw;
      max-width: 190px;
      pointer-events: none;
      z-index: 1;
    }
    .stage::before {
      left: 0;
      background: linear-gradient(90deg, #000 0%, rgba(0,2,4,0.97) 55%, transparent 100%);
    }
    .stage::after {
      right: 0;
      background: linear-gradient(270deg, #000 0%, rgba(0,2,4,0.97) 55%, transparent 100%);
    }

    /* Single landscape curved bezel (monitor frame — not dual phones) */
    .device {
      position: relative;
      z-index: 2;
      width: min(1180px, 96vw);
      aspect-ratio: 16 / 10;
      max-height: 94vh;
      border-radius: 36px;
      padding: 14px;
      background: linear-gradient(160deg, #1c2a3a 0%, #0c1520 45%, #050a12 100%);
      box-shadow:
        0 0 0 1px rgba(100, 140, 170, 0.3),
        0 0 0 3px rgba(0,0,0,0.55),
        0 36px 100px rgba(0,0,0,0.95),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: #021018;
      border: 1px solid rgba(45, 226, 230, 0.1);
    }

    /* Whale + seafloor from inspo crop inside chrome (not body wallpaper) */
    .scene {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .scene-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 48%;
      filter: saturate(1.05) contrast(1.08) brightness(0.82);
      pointer-events: none;
      user-select: none;
    }
    .scene-fade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(2,12,20,0.92) 0%, rgba(2,12,20,0.35) 12%, transparent 28%, transparent 52%, rgba(2,10,16,0.45) 72%, rgba(2,10,16,0.97) 100%),
        linear-gradient(90deg, rgba(2,12,20,0.25) 0%, transparent 18%, transparent 72%, rgba(2,12,20,0.5) 100%);
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 12px 14px 10px;
      pointer-events: none;
    }
    .hud button,
    .hud .ring,
    .hud .bar,
    .hud .slider-row,
    .hud .nav-icon,
    .hud .chip,
    .hud .panel,
    .hud .metric-tile,
    .hud input { pointer-events: auto; }

    /* Header: brand left + icon strip right */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 12px var(--glow), inset 0 0 5px rgba(45,226,230,0.5);
      position: relative;
      flex-shrink: 0;
    }
    .brand-dot::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45,226,230,0.65), transparent 70%);
    }
    .brand h1 {
      font-family: "Orbitron", sans-serif;
      font-weight: 600;
      font-size: clamp(11px, 1.25vw, 15px);
      letter-spacing: 0.38em;
      color: #eafcfd;
      text-shadow: 0 0 18px var(--glow);
    }
    .nav-icons {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 58%;
    }
    .nav-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: 0.15s ease;
      padding: 0;
    }
    .nav-icon:hover, .nav-icon.active {
      color: var(--cyan);
      border-color: var(--border);
      background: rgba(45,226,230,0.12);
      box-shadow: 0 0 10px rgba(45,226,230,0.28);
    }
    .nav-icon svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    .mid { position: relative; min-height: 0; }

    /* Top-left circular radar */
    .radar {
      position: absolute;
      top: 6px;
      left: 2px;
      width: min(16%, 132px);
      aspect-ratio: 1;
      background: rgba(3,14,22,0.45);
      border: 1px solid var(--border-s);
      border-radius: 50%;
      padding: 5px;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      box-shadow: 0 0 20px rgba(0,0,0,0.35), inset 0 0 20px rgba(45,226,230,0.06);
    }
    .radar svg { width: 100%; height: 100%; display: block; }
    .radar-sweep {
      transform-origin: 80px 80px;
      animation: spin 12s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Center top metrics: 388% + icon tiles */
    .top-metrics {
      position: absolute;
      top: 6px;
      left: 17.5%;
      right: 29%;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .metric-big {
      min-width: 70px;
      padding: 2px 6px;
    }
    .metric-big .val {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(18px, 2.1vw, 28px);
      font-weight: 600;
      color: var(--cyan-b);
      text-shadow: 0 0 22px var(--glow);
      line-height: 1;
      letter-spacing: 0.04em;
    }
    .metric-big .lbl {
      font-size: 8px;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .metric-tile {
      flex: 1;
      min-width: 0;
      background: var(--glass);
      border: 1px solid var(--border-s);
      border-radius: 8px;
      padding: 6px 4px 5px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s ease;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .metric-tile:hover {
      border-color: var(--border);
      box-shadow: 0 0 14px rgba(45,226,230,0.22);
      background: rgba(6, 28, 40, 0.75);
    }
    .metric-tile .ico {
      width: 20px;
      height: 20px;
      margin: 0 auto 3px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--cyan);
      box-shadow: 0 0 8px rgba(45,226,230,0.25);
    }
    .metric-tile .ico svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .metric-tile .t { font-size: 7px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
    .metric-tile .n { font-family: "Orbitron", sans-serif; font-size: 9px; color: var(--cyan-b); margin-top: 2px; }

    /* Right column: gauge + clock, sparkline, bar chart */
    .right-col {
      position: absolute;
      top: 2px;
      right: 0;
      width: min(27%, 235px);
      height: calc(100% - 4px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
    }
    .right-top {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .circ-gauge {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      position: relative;
    }
    .circ-gauge svg { width: 100%; height: 100%; }
    .time-block {
      flex: 1;
      text-align: right;
      padding-top: 2px;
    }
    .time-block .clock {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 600;
      color: var(--cyan-b);
      text-shadow: 0 0 18px var(--glow);
      letter-spacing: 0.06em;
      line-height: 1;
    }
    .time-block .sub {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.16em;
      margin-top: 4px;
    }

    .spark {
      background: var(--glass);
      border: 1px solid var(--border-s);
      border-radius: 7px;
      padding: 5px 7px 3px;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .spark .lab {
      font-size: 7px;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .spark svg { width: 100%; height: 32px; display: block; }

    .bar-panel {
      flex: 1;
      min-height: 0;
      background: var(--glass);
      border: 1px solid var(--border-s);
      border-radius: 9px;
      padding: 7px 8px 6px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .bar-panel .lab {
      font-size: 7px;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .bars {
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      min-height: 0;
      padding-bottom: 2px;
    }
    .bar {
      flex: 1;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(180deg, var(--cyan-b), var(--cyan-d));
      box-shadow: 0 0 8px rgba(45,226,230,0.35);
      cursor: pointer;
      transition: filter 0.15s, transform 0.15s;
      min-height: 8%;
    }
    .bar:hover { filter: brightness(1.25); transform: scaleY(1.05); transform-origin: bottom; }

    /* Bottom: 4 panels — sliders | rings | gauge+chips | mini charts */
    .bottom {
      display: grid;
      grid-template-columns: 1.2fr 1.4fr 0.95fr 1.15fr;
      gap: 8px;
      margin-top: 4px;
    }
    .panel {
      background: rgba(3, 14, 22, 0.78);
      border: 1px solid var(--border-s);
      border-radius: 10px;
      padding: 8px 9px 7px;
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      box-shadow: inset 0 0 22px rgba(45,226,230,0.04);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .panel:hover {
      border-color: var(--border);
      box-shadow: 0 0 16px rgba(45,226,230,0.12);
    }
    .panel .pt {
      font-size: 7px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .slider-row span {
      font-size: 8px;
      color: var(--muted);
      width: 38px;
      flex-shrink: 0;
      letter-spacing: 0.06em;
    }
    .slider-row input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--cyan) var(--p, 50%), rgba(45,226,230,0.12) var(--p, 50%));
      outline: none;
      cursor: pointer;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan-b);
      box-shadow: 0 0 8px var(--glow);
      cursor: pointer;
    }

    .rings {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      align-items: center;
    }
    .ring {
      flex: 1;
      text-align: center;
      cursor: pointer;
    }
    .ring svg { width: 100%; max-width: 58px; height: auto; display: block; margin: 0 auto; }
    .ring .rv {
      font-family: "Orbitron", sans-serif;
      font-size: 10px;
      color: var(--cyan-b);
      margin-top: -2px;
      letter-spacing: 0.04em;
    }
    .ring .rl {
      font-size: 6px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mini-gauges {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .mini-gauges .mg {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      position: relative;
    }
    .mini-gauges .mg svg { width: 100%; height: 100%; }
    .mini-gauges .mg .pct {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Orbitron", sans-serif;
      font-size: 10px;
      color: var(--cyan-b);
    }
    .chips {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 8px;
      color: var(--muted);
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .chip i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--glow);
      flex-shrink: 0;
    }
    .chip .barline {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(45,226,230,0.12);
      overflow: hidden;
    }
    .chip .barline b {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan-d), var(--cyan-b));
      box-shadow: 0 0 6px rgba(45,226,230,0.4);
    }

    .mini-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      height: calc(100% - 16px);
    }
    .mini-charts .mc {
      background: rgba(2,10,16,0.5);
      border: 1px solid var(--border-s);
      border-radius: 5px;
      padding: 3px;
      display: flex;
      flex-direction: column;
    }
    .mini-charts .mc span {
      font-size: 6px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .mini-charts .mc svg { flex: 1; width: 100%; min-height: 0; }

    .status {
      position: absolute;
      bottom: 4px;
      left: 16%;
      font-size: 8px;
      letter-spacing: 0.2em;
      color: rgba(45,226,230,0.35);
      font-family: "Orbitron", sans-serif;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .device { border-radius: 18px; padding: 8px; }
      .screen { border-radius: 12px; }
      .nav-icons { max-width: 48%; }
      .bottom { grid-template-columns: 1fr 1fr; gap: 5px; }
      .bottom .panel:nth-child(n+3) { display: none; }
      .metric-tile .t { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"></div>

  <div class="device">
    <div class="screen">
      <div class="scene">
        <img class="scene-img" src="../inspo/Fjm_ePFVEAIb2zq.jpeg" alt="" />
        <div class="scene-fade"></div>
      </div>

      <div class="hud">
        <header class="header">
          <div class="brand">
            <div class="brand-dot" aria-hidden="true"></div>
            <h1>HOLHHACUIND</h1>
          </div>
          <nav class="nav-icons" aria-label="HUD modules">
            <button class="nav-icon active" title="Home" type="button">
              <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
            </button>
            <button class="nav-icon" title="Radar" type="button">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
            </button>
            <button class="nav-icon" title="Pulse" type="button">
              <svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
            </button>
            <button class="nav-icon" title="Depth" type="button">
              <svg viewBox="0 0 24 24"><path d="M4 18c3-4 5-6 8-6s5 2 8 6"/><path d="M4 12c3-4 5-6 8-6s5 2 8 6"/><path d="M4 6c3-2 5-3 8-3s5 1 8 3"/></svg>
            </button>
            <button class="nav-icon" title="Pod" type="button">
              <svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="8" ry="5"/><path d="M8 10c1-3 3-4 4-4s3 1 4 4"/></svg>
            </button>
            <button class="nav-icon" title="Grid" type="button">
              <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
            </button>
            <button class="nav-icon" title="Link" type="button">
              <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l1.41-1.41a5 5 0 0 0-7.07-7.07L10 5.93"/><path d="M14 11a5 5 0 0 0-7.07 0L5.5 12.41a5 5 0 0 0 7.07 7.07L14 18.07"/></svg>
            </button>
            <button class="nav-icon" title="Alert" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 3l9 16H3L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
            </button>
            <button class="nav-icon" title="Settings" type="button">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="nav-icon" title="Power" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M7.5 6.5a7 7 0 1 0 9 0"/></svg>
            </button>
          </nav>
        </header>

        <div class="mid">
          <div class="radar" aria-label="Sonar radar">
            <svg viewBox="0 0 160 160">
              <defs>
                <radialGradient id="rg" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="rgba(45,226,230,0.15)"/>
                  <stop offset="100%" stop-color="rgba(45,226,230,0)"/>
                </radialGradient>
              </defs>
              <circle cx="80" cy="80" r="74" fill="url(#rg)" stroke="rgba(45,226,230,0.25)" stroke-width="1"/>
              <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(45,226,230,0.18)" stroke-width="0.8"/>
              <circle cx="80" cy="80" r="34" fill="none" stroke="rgba(45,226,230,0.18)" stroke-width="0.8"/>
              <circle cx="80" cy="80" r="14" fill="none" stroke="rgba(45,226,230,0.3)" stroke-width="0.8"/>
              <line x1="80" y1="6" x2="80" y2="154" stroke="rgba(45,226,230,0.12)" stroke-width="0.6"/>
              <line x1="6" y1="80" x2="154" y2="80" stroke="rgba(45,226,230,0.12)" stroke-width="0.6"/>
              <g class="radar-sweep">
                <path d="M80 80 L80 8 A72 72 0 0 1 130 30 Z" fill="rgba(45,226,230,0.18)"/>
              </g>
              <circle cx="110" cy="48" r="3" fill="#7ef9fc" opacity="0.9">
                <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
              </circle>
              <circle cx="55" cy="100" r="2.5" fill="#2de2e6" opacity="0.7"/>
              <circle cx="95" cy="115" r="2" fill="#2de2e6" opacity="0.55"/>
              <circle cx="80" cy="80" r="4" fill="none" stroke="#7ef9fc" stroke-width="1.5"/>
              <circle cx="80" cy="80" r="2" fill="#7ef9fc"/>
            </svg>
          </div>

          <div class="top-metrics">
            <div class="metric-big">
              <div class="val" id="bigVal">388%</div>
              <div class="lbl">Net force</div>
            </div>
            <button class="metric-tile" type="button" data-n="42.1">
              <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 10l7-7 7 7"/></svg></div>
              <div class="t">Ascent</div>
              <div class="n">42.1 kn</div>
            </button>
            <button class="metric-tile" type="button" data-n="18.4">

  <script>
    (function () {
      // Nav toggle
      document.querySelectorAll(".nav-icon").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".nav-icon").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
        });
      });

      // Range fill
      document.querySelectorAll('.slider-row input[type="range"]').forEach(function (el) {
        function sync() {
          el.parentElement.style.setProperty("--p", el.value + "%");
        }
        el.addEventListener("input", sync);
        sync();
      });

      // Metric tiles bump big value
      document.querySelectorAll(".metric-tile").forEach(function (tile) {
        tile.addEventListener("click", function () {
          var n = tile.getAttribute("data-n") || "100";
          var el = document.getElementById("bigVal");
          el.textContent = (parseFloat(n) * 9.2).toFixed(0) + "%";
        });
      });

      // Subtle bar animation
      var bars = document.querySelectorAll("#bars .bar");
      setInterval(function () {
        bars.forEach(function (b) {
          var h = 30 + Math.random() * 65;
          b.style.height = h + "%";
        });
      }, 2200);

      // Clock-ish readout flicker
      var clock = document.getElementById("clock");
      var base = 121;
      setInterval(function () {
        var frac = (40 + Math.floor(Math.random() * 9));
        clock.textContent = base + ":" + frac + "%";
      }, 1800);

      // Ring click pulse
      document.querySelectorAll(".ring").forEach(function (r) {
        r.addEventListener("click", function () {
          r.style.filter = "brightness(1.4)";
          setTimeout(function () { r.style.filter = ""; }, 200);
        });
      });
    })();
  </script>
