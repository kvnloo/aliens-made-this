<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOLHHACUIND — Ocean HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050a12;
      --cyan: #2de2e6;
      --cyan-b: #5ef0f4;
      --cyan-d: #148a92;
      --glow: rgba(45, 226, 230, 0.45);
      --text: #b8eef0;
      --muted: rgba(140, 200, 210, 0.42);
      --glass: rgba(6, 16, 26, 0.42);
      --border: rgba(45, 226, 230, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #03060a;
      font-family: "Rajdhani", system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
    }
    /* Side vignette curtains (inspo: dark left/right flanks) */
    .curtains {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% 50%, #0a1420 0%, #04080e 55%, #010305 100%);
    }
    .curtains::before,
    .curtains::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 16vw;
    }
    .curtains::before {
      left: 0;
      background: linear-gradient(90deg, #010204 0%, rgba(2,4,8,0.9) 45%, transparent 100%);
    }
    .curtains::after {
      right: 0;
      background: linear-gradient(270deg, #010204 0%, rgba(2,4,8,0.9) 45%, transparent 100%);
    }

    /* Single landscape tablet — matches inspo device frame */
    .device {
      position: relative;
      z-index: 1;
      width: min(1180px, 96vw);
      aspect-ratio: 16 / 10.4;
      max-height: 94vh;
      border-radius: 28px;
      padding: 14px;
      background: linear-gradient(160deg, #1a2736 0%, #0c1520 40%, #070e16 100%);
      box-shadow:
        0 0 0 1px rgba(80, 120, 150, 0.28),
        0 40px 100px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #061018;
      border: 1px solid rgba(45, 226, 230, 0.08);
    }

    /* Hero scene: inspo crop of whale + terrain (inside chrome, not body wallpaper) */
    .scene {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .scene-img {
      position: absolute;
      /* Crop to whale + seabed region of inspo */
      left: -2%;
      top: -4%;
      width: 104%;
      height: 104%;
      object-fit: cover;
      object-position: 48% 52%;
      filter: saturate(1.05) contrast(1.05) brightness(0.92);
      pointer-events: none;
    }
    /* Soft dark scrim so HUD panels read; keep cyan ocean glow */
    .scene-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(4,12,20,0.55) 0%, transparent 22%, transparent 62%, rgba(3,10,18,0.75) 100%),
        linear-gradient(90deg, rgba(4,12,20,0.35) 0%, transparent 28%, transparent 72%, rgba(4,12,20,0.4) 100%),
        radial-gradient(ellipse 55% 45% at 48% 48%, transparent 30%, rgba(2,8,14,0.35) 100%);
      pointer-events: none;
    }
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--cyan-b);
      opacity: 0.45;
      box-shadow: 0 0 4px var(--glow);
      animation: float 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.25; }
      50% { transform: translateY(-22px); opacity: 0.75; }
    }

    /* ===== HUD LAYER ===== */
    .hud {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 16px 18px 14px;
      gap: 6px;
      pointer-events: none;
    }
    .hud > * { pointer-events: none; }
    .hud button,
    .hud .ring,
    .hud .bar,
    .hud .slider-row,
    .hud .nav-icon,
    .hud .chip {
      pointer-events: auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-ring {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 14px var(--glow), inset 0 0 8px rgba(45,226,230,0.3);
      position: relative;
      flex-shrink: 0;
    }
    .brand-ring::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 1px solid rgba(45,226,230,0.45);
    }
    .brand h1 {
      font-family: "Orbitron", sans-serif;
      font-weight: 600;
      font-size: clamp(12px, 1.55vw, 17px);
      letter-spacing: 0.2em;
      color: #d8fafc;
      text-shadow: 0 0 18px var(--glow);
    }
    .nav-icons {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav-icon {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .nav-icon:hover, .nav-icon.active {
      color: var(--cyan);
      border-color: var(--border);
      background: rgba(45,226,230,0.1);
      box-shadow: 0 0 10px rgba(45,226,230,0.2);
    }
    .nav-icon svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    /* Mid: floating overlays matching inspo positions */
    .mid {
      position: relative;
      min-height: 0;
    }

    /* Top-left radar network */
    .radar {
      position: absolute;
      top: 2%;
      left: 0;
      width: min(22%, 200px);
      aspect-ratio: 1;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .radar svg { width: 100%; height: 100%; display: block; }
    .radar-needle { transform-origin: 50% 50%; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Top-center: 388% + icon chips (over whale) */
    .top-metrics {
      position: absolute;
      top: 0;
      left: 24%;
      right: 28%;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }
    .big-metric {
      background: rgba(4,14,22,0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px 8px;
      backdrop-filter: blur(6px);
      min-width: 90px;
    }
    .big-metric .lbl {
      font-size: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .big-metric .val {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(22px, 2.8vw, 32px);
      font-weight: 600;
      color: var(--cyan-b);
      text-shadow: 0 0 18px var(--glow);
      line-height: 1.05;
    }
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 4px;
    }
    .chip {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(6,18,28,0.55);
      display: grid;
      place-items: center;
      color: var(--cyan);
      cursor: pointer;
      transition: 0.15s;
      backdrop-filter: blur(4px);
    }
    .chip:hover {
      background: rgba(45,226,230,0.14);
      box-shadow: 0 0 14px rgba(45,226,230,0.3);
    }
    .chip svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
    }
    .chip-dial {
      width: 38px;
      height: 38px;
    }
    .chip-dial svg { width: 100%; height: 100%; }

    /* Right stack: chrono + spark + bars */
    .right-stack {
      position: absolute;
      top: 0;
      right: 0;
      width: min(26%, 240px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 92%;
    }
    .panel {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .panel h3 {
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 4px;
    }
    .chrono {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(18px, 2.2vw, 26px);
      color: var(--cyan-b);
      text-shadow: 0 0 14px var(--glow);
      line-height: 1.1;
    }
    .chrono small {
      font-size: 0.55em;
      opacity: 0.85;
      margin-left: 4px;
    }
    .spark {
      width: 100%;
      height: 40px;
      display: block;
      margin-top: 4px;
    }
    .bars-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      flex: 1;
      min-height: 80px;
      padding-top: 6px;
    }
    .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--cyan-b), var(--cyan-d));
      border-radius: 2px 2px 0 0;
      opacity: 0.88;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(45,226,230,0.22);
      min-height: 8%;
      transition: height 0.3s ease, opacity 0.15s, filter 0.15s;
    }
    .bar:hover { opacity: 1; filter: brightness(1.25); }

    /* Mini gauges under chips (right of 388%) */
    .mid-gauges {
      position: absolute;
      top: 52px;
      left: 42%;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .mini-gauge {
      width: 36px;
      height: 36px;
      position: relative;
    }
    .mini-gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }

    /* Footer strip */
    .footer {
      display: grid;
      grid-template-columns: 1.15fr 1.25fr 1.1fr;
      gap: 8px;
      align-items: stretch;
    }
    .foot {
      background: rgba(6, 16, 26, 0.55);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .foot h3 {
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .sliders { display: flex; flex-direction: column; gap: 5px; }
    .slider-row {
      display: grid;
      grid-template-columns: 42px 1fr 26px;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: var(--muted);
      cursor: pointer;
    }
    .track {
      height: 4px;
      background: rgba(45,226,230,0.12);
      border-radius: 2px;
      overflow: hidden;
    }
    .track > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan-d), var(--cyan));
      border-radius: 2px;
      box-shadow: 0 0 6px var(--glow);
    }
    .rings {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 4px;
      padding: 2px 0 4px;
    }
    .ring {
      width: 58px;
      height: 58px;
      position: relative;
      cursor: pointer;
    }
    .ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring .num {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      color: var(--cyan-b);
      text-shadow: 0 0 8px var(--glow);
    }
    .ring:hover .num { color: #fff; }
    .foot-right {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 8px;
      align-items: center;
    }
    .big-dial {
      width: 60px;
      height: 60px;
      position: relative;
    }
    .big-dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .big-dial .num {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      color: var(--cyan-b);
      text-shadow: 0 0 8px var(--glow);
    }
    .mini-charts {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .mini-charts svg {
      width: 100%;
      height: 22px;
      display: block;
    }
    .dots {
      display: flex;
      gap: 4px;
      margin-top: 2px;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan-d);
      box-shadow: 0 0 4px var(--glow);
    }
    .dot.on {
      background: var(--cyan-b);
      animation: pulse 1.6s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }

    @media (max-width: 700px) {
      .device { aspect-ratio: auto; max-height: none; height: auto; min-height: 92vh; }
      .screen { min-height: 88vh; }
      .radar { width: 36%; }
      .right-stack { width: 38%; }
      .footer { grid-template-columns: 1fr; }
      .top-metrics { left: 38%; right: 40%; }
    }
  </style>
</head>
<body>
  <div class="curtains" aria-hidden="true"></div>
  <div class="device">
    <div class="screen">
      <div class="scene" aria-hidden="true">
        <img
          class="scene-img"
          src="../inspo/Fjm_ePFVEAIb2zq.jpeg"
          alt=""
        />
        <div class="scene-scrim"></div>
        <div class="particles" id="particles"></div>
      </div>

      <div class="hud">
        <header class="header">
          <div class="brand">
            <div class="brand-ring" aria-hidden="true"></div>
            <h1>HOLHHACUIND</h1>
          </div>
          <nav class="nav-icons" aria-label="HUD modules">
            <button type="button" class="nav-icon active" title="Scan" aria-label="Scan">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
            </button>
            <button type="button" class="nav-icon" title="Map" aria-label="Map">
              <svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg>
            </button>
            <button type="button" class="nav-icon" title="Bio" aria-label="Bio">
              <svg viewBox="0 0 24 24"><path d="M12 21c-4-3.5-7-6.5-7-10a4 4 0 018 0 4 4 0 018 0c0 3.5-3 6.5-7 10z"/></svg>
            </button>
            <button type="button" class="nav-icon" title="Signal" aria-label="Signal">
              <svg viewBox="0 0 24 24"><path d="M2 12h4l3 8 4-16 3 8h4"/></svg>
            </button>
            <button type="button" class="nav-icon" title="Link" aria-label="Link">
              <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.5.5l2-2a5 5 0 00-7-7l-1.1 1"/><path d="M14 11a5 5 0 00-7.5-.5l-2 2a5 5 0 007 7l1.1-1"/></svg>
            </button>
            <button type="button" class="nav-icon" title="Grid" aria-label="Grid">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            </button>
            <button type="button" class="nav-icon" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </nav>
        </header>

        <div class="mid">
          <div class="radar" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(45,226,230,0.12)" stroke-width="1"/>
              <circle cx="60" cy="60" r="38" fill="none" stroke="rgba(45,226,230,0.15)" stroke-width="1"/>
              <circle cx="60" cy="60" r="24" fill="none" stroke="rgba(45,226,230,0.22)" stroke-width="1"/>
              <circle cx="60" cy="60" r="10" fill="none" stroke="rgba(45,226,230,0.4)" stroke-width="1.5"/>
              <line x1="60" y1="8" x2="60" y2="112" stroke="rgba(45,226,230,0.1)" stroke-width="0.8"/>
              <line x1="8" y1="60" x2="112" y2="60" stroke="rgba(45,226,230,0.1)" stroke-width="0.8"/>
              <path class="radar-needle" d="M60 60 L60 14" stroke="#2de2e6" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="60" cy="60" r="3.5" fill="#2de2e6"/>
              <circle cx="82" cy="38" r="2.5" fill="#5ef0f4"/>
              <circle cx="40" cy="72" r="2" fill="#2de2e6" opacity="0.7"/>
              <circle cx="75" cy="85" r="1.5" fill="#5ef0f4" opacity="0.6"/>
              <path d="M28 48 Q50 28 72 50 T98 42" fill="none" stroke="rgba(45,226,230,0.28)" stroke-width="0.8"/>
              <path d="M24 74 Q48 94 68 76 T102 82" fill="none" stroke="rgba(45,226,230,0.2)" stroke-width="0.8"/>
              <path d="M45 30 L52 48 L70 52 L55 62 L58 80 L45 70 L32 80 L35 62 L20 52 L38 48 Z" fill="none" stroke="rgba(45,226,230,0.15)" stroke-width="0.6" transform="translate(10,5) scale(0.85)"/>
            </svg>
          </div>

          <div class="top-metrics">
            <div class="big-metric">
              <div class="lbl">Integrity</div>
              <div class="val" id="pct">388%</div>
            </div>
            <div class="chips">
              <button type="button" class="chip" title="Depth" aria-label="Depth">
                <svg viewBox="0 0 24 24"><path d="M12 3v18M5 12h14"/><circle cx="12" cy="12" r="8"/></svg>
              </button>
              <button type="button" class="chip" title="Pod" aria-label="Pod">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="8" ry="4"/><path d="M4 13c0-4 3.5-7 8-7s8 3 8 7"/></svg>
              </button>
              <button type="button" class="chip" title="Echo" aria-label="Echo">
                <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0116 0"/><path d="M7 12a5 5 0 0110 0"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
              </button>
              <div class="chip chip-dial" aria-hidden="true">
                <svg viewBox="0 0 36 36">
                  <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(45,226,230,0.15)" stroke-width="2"/>
                  <circle cx="18" cy="18" r="14" fill="none" stroke="#2de2e6" stroke-width="2" stroke-dasharray="55 88" stroke-linecap="round" transform="rotate(-90 18 18)"/>
                  <circle cx="18" cy="18" r="3" fill="#2de2e6"/>
                </svg>
              </div>
              <button type="button" class="chip" title="Wave" aria-label="Wave">
                <svg viewBox="0 0 24 24"><path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"/></svg>
              </button>
            </div>
          </div>

          <div class="right-stack">
            <div class="panel">
              <h3>Chrono · Sync</h3>
              <div class="chrono" id="chrono">121:4<small id="chrono-pct">0%</small></div>
              <svg class="spark" viewBox="0 0 140 40" preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="rgba(45,226,230,0.35)"/>
                    <stop offset="100%" stop-color="rgba(45,226,230,0)"/>
                  </linearGradient>
                </defs>
                <polyline fill="url(#sg)" stroke="none"
                  points="0,40 0,28 12,24 24,26 36,14 48,20 60,10 72,16 84,8 96,18 108,12 120,22 132,16 140,20 140,40"/>
                <polyline id="spark" fill="none" stroke="#2de2e6" stroke-width="1.6"
                  points="0,28 12,24 24,26 36,14 48,20 60,10 72,16 84,8 96,18 108,12 120,22 132,16 140,20"
                  style="filter: drop-shadow(0 0 3px rgba(45,226,230,0.65))"/>
              </svg>
            </div>
            <div class="panel bars-panel">
              <h3>Bandwidth · Depth</h3>
              <div class="bars" id="bars" role="img" aria-label="Bar chart"></div>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="foot">
            <h3>Bioflux · Telemetry</h3>

  <script>
    (function () {
      const bars = document.getElementById("bars");
      const heights = [38, 52, 42, 68, 48, 82, 58, 92, 55, 74, 44, 66, 78, 50, 70, 60];
      heights.forEach((h, i) => {
        const b = document.createElement("div");
        b.className = "bar";
        b.style.height = h + "%";
        b.title = "bin " + (i + 1) + ": " + h;
        b.addEventListener("click", () => {
          b.style.height = 18 + Math.random() * 78 + "%";
        });
        bars.appendChild(b);
      });

      const parts = document.getElementById("particles");
      for (let i = 0; i < 32; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.top = 18 + Math.random() * 55 + "%";
        p.style.animationDelay = Math.random() * 5 + "s";
        p.style.animationDuration = 4 + Math.random() * 5 + "s";
        parts.appendChild(p);
      }

      document.querySelectorAll(".nav-icon").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".nav-icon").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });

      const chrono = document.getElementById("chrono");
      const chronoPct = document.getElementById("chrono-pct");
      let t = 121.4;
      setInterval(() => {
        t += 0.02 + Math.random() * 0.04;
        if (t > 999) t = 100;
        const whole = Math.floor(t);
        const frac = Math.floor((t % 1) * 10);
        chrono.childNodes[0].textContent = whole + ":" + frac;
        chronoPct.textContent = Math.floor(Math.random() * 5) + "%";
      }, 1200);

      document.querySelectorAll(".slider-row").forEach((row) => {
        row.addEventListener("click", () => {
          const v = 20 + Math.floor(Math.random() * 75);
          row.querySelector("i").style.width = v + "%";
          row.querySelectorAll("span")[1].textContent = String(v);
        });
      });

      document.querySelectorAll(".ring, .chip").forEach((el) => {
        el.addEventListener("click", () => {
          el.style.filter = "brightness(1.4)";
          setTimeout(() => { el.style.filter = ""; }, 180);
        });
      });
    })();
  </script>
</body>
</html>
