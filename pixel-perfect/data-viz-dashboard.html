<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOLHHACUIND — Ocean HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050a12;
      --cyan: #2de2e6;
      --cyan-b: #6ef5f8;
      --cyan-d: #0e6e78;
      --glow: rgba(45, 226, 230, 0.55);
      --text: #c8f4f6;
      --muted: rgba(130, 190, 200, 0.42);
      --glass: rgba(4, 14, 24, 0.42);
      --border: rgba(45, 226, 230, 0.24);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #010305;
      font-family: "Rajdhani", system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* Dark vignette + side curtains (inspo framing) */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 68% 62% at 50% 48%, #0c1824 0%, #050c14 50%, #010305 100%);
    }
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 15vw;
      max-width: 180px;
      pointer-events: none;
    }
    .stage::before {
      left: 0;
      background: linear-gradient(90deg, #000 0%, rgba(1,3,6,0.92) 45%, transparent 100%);
    }
    .stage::after {
      right: 0;
      background: linear-gradient(270deg, #000 0%, rgba(1,3,6,0.92) 45%, transparent 100%);
    }

    /* Landscape tablet device */
    .device {
      position: relative;
      z-index: 1;
      width: min(1180px, 96vw);
      aspect-ratio: 16 / 10.4;
      max-height: 94vh;
      border-radius: 28px;
      padding: 11px;
      background: linear-gradient(155deg, #1a2836 0%, #0c1520 50%, #070e16 100%);
      box-shadow:
        0 0 0 1px rgba(80, 120, 150, 0.28),
        0 40px 100px rgba(0,0,0,0.9),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #031018;
      border: 1px solid rgba(45, 226, 230, 0.08);
    }

    /* Hero scene: inspo crop inside chrome (NOT body wallpaper) */
    .scene {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .scene-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 48% 42%;
      filter: saturate(1.12) contrast(1.1) brightness(0.82);
      pointer-events: none;
      user-select: none;
    }
    .scene-scrim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(2,10,18,0.78) 0%, rgba(2,10,18,0.2) 16%, transparent 30%, transparent 52%, rgba(2,8,14,0.88) 100%),
        linear-gradient(90deg, rgba(2,10,18,0.35) 0%, transparent 20%, transparent 78%, rgba(2,10,18,0.4) 100%);
    }

    /* Procedural underwater fallback under img (if crop fails) */
    .scene-fall {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 40% at 48% 42%, rgba(20, 80, 100, 0.35) 0%, transparent 70%),
        linear-gradient(180deg, #061420 0%, #0a2a38 40%, #0c3a48 70%, #071820 100%);
      z-index: -1;
    }
    .whale-svg {
      position: absolute;
      left: 8%;
      top: 18%;
      width: 68%;
      height: 58%;
      opacity: 0.92;
      filter: drop-shadow(0 0 30px rgba(45, 200, 220, 0.25));
      pointer-events: none;
    }
    .terrain {
      position: absolute;
      left: 0; right: 0; bottom: 18%;
      height: 38%;
      opacity: 0.55;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 12px 14px 10px;
      gap: 2px;
      pointer-events: none;
    }
    .hud button,
    .hud .ring,
    .hud .bar,
    .hud .slider-row,
    .hud .nav-icon,
    .hud .chip {
      pointer-events: auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 12px var(--glow), inset 0 0 6px rgba(45,226,230,0.4);
      position: relative;
      flex-shrink: 0;
    }
    .brand-ring::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px solid rgba(45,226,230,0.55);
    }
    .brand h1 {
      font-family: "Orbitron", sans-serif;
      font-weight: 600;
      font-size: clamp(10px, 1.35vw, 15px);
      letter-spacing: 0.28em;
      color: #e0fbfc;
      text-shadow: 0 0 18px var(--glow);
    }
    .nav-icons {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 58%;
    }
    .nav-icon {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: 0.15s ease;
      padding: 0;
    }
    .nav-icon:hover, .nav-icon.active {
      color: var(--cyan);
      border-color: var(--border);
      background: rgba(45,226,230,0.1);
      box-shadow: 0 0 8px rgba(45,226,230,0.25);
    }
    .nav-icon svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    .mid { position: relative; min-height: 0; }

    /* Top-left radar network */
    .radar {
      position: absolute;
      top: 2px;
      left: 0;
      width: min(19%, 170px);
      aspect-ratio: 1;
      background: rgba(4, 14, 24, 0.38);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .radar svg { width: 100%; height: 100%; display: block; }
    .radar-sweep {
      transform-origin: 80px 80px;
      animation: spin 14s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Top metrics over whale */
    .top-metrics {
      position: absolute;
      top: 2px;
      left: 21%;
      right: 28%;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      flex-wrap: wrap;
    }
    .big-metric {
      background: rgba(4,12,20,0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 9px 5px;
      backdrop-filter: blur(4px);
      min-width: 72px;
    }
    .big-metric .lbl {
      font-size: 6.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .big-metric .val {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 600;
      color: var(--cyan-b);
      text-shadow: 0 0 16px var(--glow);
      line-height: 1.05;
    }
    .chips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding-top: 1px;
    }
    .chip {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(4,14,22,0.48);
      display: grid;
      place-items: center;
      color: var(--cyan);
      cursor: pointer;
      transition: 0.15s;
      backdrop-filter: blur(4px);
      padding: 0;
    }
    .chip:hover, .chip.active {
      background: rgba(45,226,230,0.16);
      box-shadow: 0 0 12px rgba(45,226,230,0.35);
    }
    .chip svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
    }
    .chip-dial { width: 32px; height: 32px; }
    .chip-dial svg { width: 100%; height: 100%; }

    .mid-gauges {
      position: absolute;
      top: 44px;
      left: 38%;
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .mini-gauge { width: 30px; height: 30px; }
    .mini-gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }

    /* Right column */
    .right-stack {
      position: absolute;
      top: 2px;
      right: 0;
      width: min(23%, 210px);
      display: flex;
      flex-direction: column;
      gap: 5px;
      height: 93%;
    }
    .panel {
      background: rgba(4, 14, 24, 0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 7px;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .panel h3 {
      font-size: 6.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 1px;
    }
    .chrono {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(15px, 1.9vw, 22px);
      color: var(--cyan-b);
      text-shadow: 0 0 12px var(--glow);
      line-height: 1.1;
    }
    .chrono small {
      font-size: 0.48em;
      opacity: 0.85;
      margin-left: 2px;
    }
    .spark {
      width: 100%;
      height: 32px;
      display: block;
      margin-top: 2px;
    }
    .bars-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      flex: 1;
      min-height: 64px;
      padding-top: 4px;
    }
    .bar {
      flex: 1;
      background: linear-gradient(180deg, #7ef5f8, #148a92 70%, #0a4a52);
      border-radius: 1px 1px 0 0;
      opacity: 0.92;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(45,226,230,0.22);
      min-height: 6%;
      transition: filter 0.15s, opacity 0.15s;
      border: none;
      padding: 0;
    }
    .bar:hover { opacity: 1; filter: brightness(1.35); }

    /* Footer 3-panel */
    .footer {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr 1.15fr;
      gap: 6px;
      align-items: stretch;
    }
    .foot {
      background: rgba(4, 12, 20, 0.62);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .foot h3 {
      font-size: 6.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .sliders { display: flex; flex-direction: column; gap: 3.5px; }
    .slider-row {
      display: grid;
      grid-template-columns: 36px 1fr 22px;
      align-items: center;
      gap: 4px;
      font-size: 7.5px;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }
    .slider-row:hover .track > i { filter: brightness(1.3); }
    .track {
      height: 3px;
      background: rgba(45,226,230,0.12);
      border-radius: 2px;
      overflow: hidden;
    }
    .track > i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan-d), var(--cyan));
      border-radius: 2px;
      box-shadow: 0 0 5px var(--glow);
    }
    .rings {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 2px;
      padding: 1px 0;
    }
    .ring {
      width: 52px;
      height: 52px;
      position: relative;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring .num {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Orbitron", sans-serif;
      font-size: 9.5px;
      color: var(--cyan-b);
      text-shadow: 0 0 8px var(--glow);
      pointer-events: none;
    }
    .ring:hover .num { color: #fff; }
    .foot-right {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 5px;
      align-items: center;
    }
    .big-dial {
      width: 56px;
      height: 56px;
      position: relative;
    }
    .big-dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .big-dial .num {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "Orbitron", sans-serif;
      font-size: 10px;
      color: var(--cyan-b);
      text-shadow: 0 0 8px var(--glow);
    }
    .mini-charts {
      display: flex;
      flex-direction: column;
      gap: 2px;
      height: 100%;
      justify-content: center;
    }
    .mini-charts svg {
      width: 100%;
      height: 16px;
    }
    .dot-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      margin-top: 2px;
    }
    .dot-grid span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(45,226,230,0.25);
    }
    .dot-grid span.on { background: var(--cyan); box-shadow: 0 0 4px var(--glow); }

    /* Floating particles over scene */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .particles i {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(100, 230, 240, 0.55);
      box-shadow: 0 0 4px rgba(45,226,230,0.5);
      animation: float 8s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-18px); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"></div>

  <div class="device">
    <div class="screen">
      <div class="scene">
        <div class="scene-fall" aria-hidden="true">
          <!-- Procedural whale silhouette matching inspo center subject -->
          <svg class="whale-svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="whaleBody" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1a3a48"/>
                <stop offset="45%" stop-color="#0e2835"/>
                <stop offset="100%" stop-color="#061820"/>
              </linearGradient>
              <linearGradient id="whaleGlow" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="rgba(45,200,220,0)"/>
                <stop offset="50%" stop-color="rgba(45,220,230,0.35)"/>
                <stop offset="100%" stop-color="rgba(45,200,220,0)"/>
              </linearGradient>
              <filter id="softGlow">
                <feGaussianBlur stdDeviation="2.5" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <!-- body -->
            <ellipse cx="380" cy="200" rx="280" ry="95" fill="url(#whaleBody)" filter="url(#softGlow)"/>
            <!-- head taper -->
            <ellipse cx="600" cy="195" rx="120" ry="70" fill="#0c2532"/>
            <!-- snout -->
            <path d="M700 195 Q760 185 780 200 Q760 215 700 210 Z" fill="#0a2030"/>
            <!-- tail stock -->
            <path d="M120 200 Q80 180 40 140 Q70 190 50 210 Q70 230 40 270 Q80 230 120 210 Z" fill="#0e2835"/>
            <!-- dorsal -->
            <path d="M340 110 Q360 70 400 105 Q370 115 340 110" fill="#0a2230"/>
            <!-- pectoral -->
            <path d="M420 250 Q450 300 400 310 Q390 270 420 250" fill="#0a2230"/>
            <!-- cyan particle trails on body -->
            <g opacity="0.55" fill="#3de8ec">
              <circle cx="280" cy="180" r="1.2"/><circle cx="300" cy="195" r="1"/>
              <circle cx="320" cy="170" r="0.9"/><circle cx="350" cy="200" r="1.1"/>
              <circle cx="380" cy="175" r="0.8"/><circle cx="410" cy="190" r="1"/>
              <circle cx="440" cy="165" r="0.9"/><circle cx="470" cy="185" r="1.1"/>
              <circle cx="500" cy="200" r="0.8"/><circle cx="530" cy="175" r="1"/>
              <circle cx="250" cy="210" r="1"/><circle cx="220" cy="190" r="0.9"/>
              <circle cx="200" cy="200" r="1.2"/><circle cx="180" cy="185" r="0.7"/>
            </g>
            <rect x="200" y="160" width="280" height="80" fill="url(#whaleGlow)" opacity="0.4"/>
            <!-- eye -->
            <circle cx="640" cy="180" r="4" fill="#0a1820" stroke="#2de2e6" stroke-width="0.8" opacity="0.7"/>
          </svg>
          <svg class="terrain" viewBox="0 0 1000 200" preserveAspectRatio="none">
            <defs>
              <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0a3040"/>
                <stop offset="100%" stop-color="#041018"/>
              </linearGradient>
            </defs>
            <path d="M0 120 L40 90 L80 110 L130 60 L180 100 L230 50 L280 95 L340 40 L400 85 L460 55 L520 100 L580 45 L640 90 L700 50 L760 95 L820 60 L880 100 L940 70 L1000 110 L1000 200 L0 200 Z" fill="url(#rock)" opacity="0.85"/>
            <path d="M0 150 L50 130 L100 155 L160 120 L220 145 L300 110 L380 140 L450 115 L530 150 L600 120 L680 145 L750 115 L830 150 L900 125 L1000 155 L1000 200 L0 200 Z" fill="#062028" opacity="0.7"/>
          </svg>
        </div>
        <!-- Optional inspo crop inside chrome -->
        <img class="scene-img" src="../inspo/Fjm_ePFVEAIb2zq.jpeg" alt=""
             onerror="this.style.display='none'" />
        <div class="scene-scrim"></div>
      </div>

      <div class="particles" id="particles" aria-hidden="true"></div>

      <div class="hud">
        <header class="header">
          <div class="brand">
            <div class="brand-ring"></div>
            <h1>HOLHHACUIND</h1>
          </div>
          <nav class="nav-icons" aria-label="Toolbar">
            <button class="nav-icon active" title="Home" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
            <button class="nav-icon" title="Scan" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
            <button class="nav-icon" title="Chart" type="button"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/></svg></button>
            <button class="nav-icon" title="Layers" type="button"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/></svg></button>
            <button class="nav-icon" title="Grid" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
            <button class="nav-icon" title="Pulse" type="button"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></button>
            <button class="nav-icon" title="Target" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
            <button class="nav-icon" title="Link" type="button"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1"/></svg></button>
            <button class="nav-icon" title="Settings" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
            <button class="nav-icon" title="More" type="button"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></button>
          </nav>
        </header>

        <div class="mid">
          <div class="radar" aria-label="Network radar">
            <svg viewBox="0 0 160 160">
              <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(45,226,230,0.12)" stroke-width="1"/>
              <circle cx="80" cy="80" r="50" fill="none" stroke="rgba(45,226,230,0.15)" stroke-width="1"/>
              <circle cx="80" cy="80" r="30" fill="none" stroke="rgba(45,226,230,0.2)" stroke-width="1"/>
              <line x1="80" y1="10" x2="80" y2="150" stroke="rgba(45,226,230,0.1)" stroke-width="0.8"/>
              <line x1="10" y1="80" x2="150" y2="80" stroke="rgba(45,226,230,0.1)" stroke-width="0.8"/>
              <!-- network nodes -->
              <g stroke="rgba(45,226,230,0.35)" stroke-width="0.7" fill="none">
                <line x1="80" y1="80" x2="40" y2="45"/><line x1="80" y1="80" x2="120" y2="40"/>

              <button class="chip chip-dial" type="button" title="Signal" aria-label="Signal">

                  <polyline points="4,22 10,14 15,18 22,8 28,12" fill="none" stroke="#2de2e6" stroke-width="1.8"/>

            </div>
          </div>

          <div class="mid-gauges" aria-hidden="true">
            <div class="mini-gauge">
              <svg viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(45,226,230,0.15)" stroke-width="3"/>
                <circle cx="18" cy="18" r="14" fill="none" stroke="#2de2e6" stroke-width="3"
                        stroke-dasharray="55 88" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="mini-gauge">
              <svg viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(45,226,230,0.15)" stroke-width="3"/>

                        stroke-dasharray="40 88" stroke-linecap="round"/>
              </svg>

          </div>

          <div class="right-stack">
            <div class="panel">
              <h3>Chronosync</h3>
              <div class="chrono">121:4<small>0%</small></div>
              <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none">
                <polyline fill="none" stroke="rgba(45,226,230,0.85)" stroke-width="1.5"
                  points="0,28 15,22 30,30 45,12 60,20 75,8 90,18 105,6 120,16 135,10 150,22 165,14 180,24 200,12"/>
                <polyline fill="rgba(45,226,230,0.08)" stroke="none"
                  points="0,40 0,28 15,22 30,30 45,12 60,20 75,8 90,18 105,6 120,16 135,10 150,22 165,14 180,24 200,12 200,40"/>
              </svg>

            <div class="panel bars-panel">
              <h3>Depth profile</h3>
              <div class="bars" id="bars" role="img" aria-label="Bar chart"></div>

        </div>

        <footer class="footer">
          <div class="foot">
            <h3>Bio-parameters · 010</h3>
            <div class="sliders" id="sliders"></div>
          </div>

            <h3>Modulators · LS suite</h3>
            <div class="rings">
              <button class="ring" type="button" data-v="91%" aria-label="91 percent">
                <svg viewBox="0 0 54 54">
                  <circle cx="27" cy="27" r="22" fill="none" stroke="rgba(45,226,230,0.12)" stroke-width="3"/>
                  <circle cx="27" cy="27" r="22" fill="none" stroke="#2de2e6" stroke-width="3.2"
                          stroke-dasharray="126 138" stroke-linecap="round"/>
                </svg>
                <span class="num">91%</span>
              </button>
              <button class="ring" type="button" data-v="94.7" aria-label="94.7">
                <svg viewBox="0 0 54 54">
                  <circle cx="27" cy="27" r="22" fill="none" stroke="rgba(45,226,230,0.12)" stroke-width="3"/>
                  <circle cx="27" cy="27" r="22" fill="none" stroke="#5ef0f4" stroke-width="3.2"
                          stroke-dasharray="118 138" stroke-linecap="round"/>

                <span class="num">94.7</span>

              <button class="ring" type="button" data-v="50.8" aria-label="50.8">

                  <circle cx="27" cy="27" r="22" fill="none" stroke="rgba(45,226,230,0.12)" stroke-width="3"/>

                <span class="num">50.8</span>

          </div>
          <div class="foot foot-right">
            <div class="big-dial">
              <svg viewBox="0 0 56 56">

                <circle cx="28" cy="28" r="23" fill="none" stroke="#2de2e6" stroke-width="3.5"
                        stroke-dasharray="100 145" stroke-linecap="round"/>
                <circle cx="28" cy="28" r="16" fill="none" stroke="rgba(45,226,230,0.2)" stroke-width="1.5"/>

              <span class="num">39%</span>

            <div class="mini-charts">
              <svg viewBox="0 0 120 16" preserveAspectRatio="none">

                  points="0,12 15,8 30,11 45,4 60,9 75,3 90,8 105,5 120,7"/>
              </svg>
              <svg viewBox="0 0 120 16" preserveAspectRatio="none">
                <rect x="2" y="8" width="6" height="8" fill="#2de2e6" opacity="0.7"/>
                <rect x="12" y="4" width="6" height="12" fill="#2de2e6" opacity="0.85"/>
                <rect x="22" y="6" width="6" height="10" fill="#2de2e6" opacity="0.6"/>
                <rect x="32" y="2" width="6" height="14" fill="#5ef0f4"/>
                <rect x="42" y="7" width="6" height="9" fill="#2de2e6" opacity="0.7"/>
                <rect x="52" y="3" width="6" height="13" fill="#2de2e6" opacity="0.9"/>
                <rect x="62" y="9" width="6" height="7" fill="#2de2e6" opacity="0.5"/>
                <rect x="72" y="5" width="6" height="11" fill="#5ef0f4" opacity="0.8"/>
                <rect x="82" y="1" width="6" height="15" fill="#2de2e6"/>
                <rect x="92" y="6" width="6" height="10" fill="#2de2e6" opacity="0.65"/>
                <rect x="102" y="4" width="6" height="12" fill="#2de2e6" opacity="0.75"/>
                <rect x="112" y="8" width="6" height="8" fill="#2de2e6" opacity="0.55"/>
              </svg>
              <div class="dot-grid" id="dots"></div>
            </div>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Bars
      var heights = [40, 55, 35, 70, 48, 85, 60, 95, 72, 50, 88, 65, 45, 78, 92, 58, 68, 42, 80, 55];
      var bars = document.getElementById("bars");
      heights.forEach(function (h, i) {
        var b = document.createElement("button");
        b.className = "bar";
        b.type = "button";
        b.style.height = h + "%";
        b.title = "Series " + (i + 1) + ": " + h;
        b.addEventListener("click", function () {
          b.style.filter = b.style.filter ? "" : "brightness(1.6)";
        });
        bars.appendChild(b);
      });

      // Sliders
      var rows = [
        { label: "Depth", v: 72, n: "72" },
        { label: "Saline", v: 48, n: "48" },
        { label: "Press", v: 86, n: "86" },
        { label: "Thermo", v: 34, n: "34" },
        { label: "Sonic", v: 61, n: "61" }
      ];
      var sl = document.getElementById("sliders");
      rows.forEach(function (r) {
        var btn = document.createElement("button");
        btn.className = "slider-row";
        btn.type = "button";
        btn.innerHTML =
          "<span>" + r.label + "</span>" +
          "<span class=\"track\"><i style=\"width:" + r.v + "%\"></i></span>" +
          "<span>" + r.n + "</span>";
        btn.addEventListener("click", function () {
          var next = (r.v + 12) % 100;
          if (next < 20) next = 20;
          r.v = next;
          btn.querySelector("i").style.width = next + "%";
          btn.querySelectorAll("span")[2].textContent = String(next);
        });
        sl.appendChild(btn);
      });

      // Dot grid
      var dots = document.getElementById("dots");
      for (var i = 0; i < 18; i++) {
        var s = document.createElement("span");
        if (i % 3 === 0 || i === 7 || i === 11) s.className = "on";
        dots.appendChild(s);
      }

      // Particles
      var p = document.getElementById("particles");
      for (var j = 0; j < 28; j++) {
        var el = document.createElement("i");
        el.style.left = Math.random() * 100 + "%";
        el.style.top = 20 + Math.random() * 55 + "%";
        el.style.animationDelay = Math.random() * 6 + "s";
        el.style.animationDuration = 5 + Math.random() * 6 + "s";
        el.style.opacity = 0.3 + Math.random() * 0.5;
        p.appendChild(el);
      }

      // Nav toggle
      document.querySelectorAll(".nav-icon").forEach(function (n) {
        n.addEventListener("click", function () {
          document.querySelectorAll(".nav-icon").forEach(function (x) { x.classList.remove("active"); });
          n.classList.add("active");
        });
      });
      document.querySelectorAll(".chip").forEach(function (c) {
        c.addEventListener("click", function () {
          document.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("active"); });
          c.classList.add("active");
        });
      });
    })();
  </script>
</body>
</html>
