<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .glass-strong {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.35);
        }
        .mountain-gradient {
            background: linear-gradient(180deg,
                rgba(255, 200, 170, 0.3) 0%,
                rgba(255, 180, 200, 0.4) 25%,
                rgba(220, 140, 180, 0.5) 50%,
                rgba(180, 100, 150, 0.6) 75%,
                rgba(140, 60, 120, 0.7) 100%);
        }
        .cloud {
            animation: float 20s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-10px) translateX(10px); }
        }
        .tree {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
    </style>
</head>
<body class="min-h-screen overflow-hidden relative" style="background: linear-gradient(135deg, #FFD6BA 0%, #E5C4E8 25%, #D4B5E8 50%, #C5A8E8 75%, #B69CE8 100%);">

    <!-- Decorative background elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <!-- Floating orbs -->
        <div class="absolute top-20 left-32 w-96 h-96 rounded-full opacity-30 blur-3xl" style="background: radial-gradient(circle, rgba(255, 200, 180, 0.4) 0%, transparent 70%);"></div>
        <div class="absolute bottom-32 right-40 w-80 h-80 rounded-full opacity-25 blur-3xl" style="background: radial-gradient(circle, rgba(200, 150, 230, 0.4) 0%, transparent 70%);"></div>

        <!-- Small decorative dots -->
        <div class="absolute top-10 left-1/4 w-1 h-1 bg-white/40 rounded-full"></div>
        <div class="absolute top-32 right-1/3 w-1.5 h-1.5 bg-white/30 rounded-full"></div>
        <div class="absolute bottom-40 left-1/3 w-1 h-1 bg-white/35 rounded-full"></div>
        <div class="absolute top-1/2 right-20 w-2 h-2 bg-white/25 rounded-full"></div>

        <!-- Trees on right side -->
        <div class="absolute bottom-0 right-0 flex items-end gap-8 opacity-40">
            <div class="relative" style="width: 120px; height: 280px;">
                <div class="tree absolute bottom-0 w-full bg-gradient-to-b from-indigo-900/60 to-indigo-950/80" style="height: 60%;"></div>
                <div class="tree absolute bottom-16 w-full bg-gradient-to-b from-indigo-800/50 to-indigo-900/70" style="height: 70%;"></div>
                <div class="tree absolute bottom-32 w-full bg-gradient-to-b from-indigo-700/40 to-indigo-800/60" style="height: 80%;"></div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-3 bg-gradient-to-b from-amber-900/60 to-amber-950/80" style="height: 25%;"></div>
            </div>
            <div class="relative" style="width: 140px; height: 340px;">
                <div class="tree absolute bottom-0 w-full bg-gradient-to-b from-indigo-900/70 to-indigo-950/90" style="height: 60%;"></div>
                <div class="tree absolute bottom-20 w-full bg-gradient-to-b from-indigo-800/60 to-indigo-900/80" style="height: 70%;"></div>
                <div class="tree absolute bottom-40 w-full bg-gradient-to-b from-indigo-700/50 to-indigo-800/70" style="height: 80%;"></div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-4 bg-gradient-to-b from-amber-900/70 to-amber-950/90" style="height: 25%;"></div>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center gap-8 p-8">

        <!-- Left Card - SCIHHERS -->
        <div class="glass-strong rounded-3xl p-8 w-[420px] shadow-2xl" style="box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl glass flex items-center justify-center">
                        <i data-lucide="compass" class="w-5 h-5 text-white" style="stroke-width: 1.5;"></i>
                    </div>
                    <h1 class="text-white text-xl font-semibold tracking-tight">SCIHHERS</h1>
                </div>
                <button class="w-10 h-10 rounded-xl glass flex items-center justify-center hover:bg-white/20 transition-colors">
                    <i data-lucide="plus" class="w-5 h-5 text-white" style="stroke-width: 1.5;"></i>
                </button>
            </div>

            <!-- Main stat card -->
            <div class="glass rounded-2xl p-6 mb-4 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 opacity-20" style="background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);"></div>
                <div class="flex items-baseline gap-2 mb-2">
                    <div class="text-white text-4xl font-semibold tracking-tight">45325</div>
                    <div class="text-white/70 text-sm">45/70</div>
                </div>
                <div class="text-white/80 text-sm mb-4">NATALIE CARSIDENT</div>
                <div class="flex items-center gap-2">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 rounded-full bg-orange-400"></div>
                        <div class="w-2 h-2 rounded-full bg-orange-300"></div>
                        <div class="w-2 h-2 rounded-full bg-white/30"></div>
                    </div>
                    <div class="text-white/60 text-xs">LEVEL 3</div>
                </div>
            </div>

            <!-- Stats grid -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="glass rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-white/70 text-xs font-medium tracking-wide">BALANCE</span>
                        <i data-lucide="more-vertical" class="w-4 h-4 text-white/50" style="stroke-width: 1.5;"></i>
                    </div>
                    <div class="text-white text-2xl font-semibold tracking-tight">49</div>
                    <div class="text-white/60 text-xs mt-1">TOTAL</div>
                </div>
                <div class="glass rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-white/70 text-xs font-medium tracking-wide">TALDUS SOYED</span>
                        <i data-lucide="more-vertical" class="w-4 h-4 text-white/50" style="stroke-width: 1.5;"></i>
                    </div>
                    <div class="text-white text-2xl font-semibold tracking-tight">93</div>
                    <div class="text-white/60 text-xs mt-1">34%</div>
                </div>
            </div>

            <!-- Wide stat card -->
            <div class="glass rounded-2xl p-5 mb-4">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-white/70 text-xs font-medium tracking-wide">MAEDIA SAHERS</span>
                    <i data-lucide="more-vertical" class="w-4 h-4 text-white/50" style="stroke-width: 1.5;"></i>
                </div>
                <div class="flex items-baseline gap-2">
                    <div class="text-white text-2xl font-semibold tracking-tight">01</div>
                    <div class="text-white/60 text-xs">YOUNG</div>
                </div>
            </div>

            <!-- Bottom buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button class="glass rounded-2xl p-5 hover:bg-white/25 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
                            <i data-lucide="bike" class="w-4 h-4 text-white" style="stroke-width: 1.5;"></i>
                        </div>
                        <span class="text-white text-sm font-medium">AI</span>
                    </div>
                </button>
                <button class="glass rounded-2xl p-5 hover:bg-white/25 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
                            <i data-lucide="home" class="w-4 h-4 text-white" style="stroke-width: 1.5;"></i>
                        </div>
                        <span class="text-white text-sm font-medium">TAAM HALL</span>
                    </div>
                </button>
            </div>

            <!-- Navigation -->
            <div class="flex items-center justify-center gap-6 mt-8">
                <button class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                    <i data-lucide="home" class="w-5 h-5 text-white/60" style="stroke-width: 1.5;"></i>
                </button>
                <button class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                    <i data-lucide="compass" class="w-5 h-5 text-white/60" style="stroke-width: 1.5;"></i>
                </button>
                <button class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                    <i data-lucide="bell" class="w-5 h-5 text-white" style="stroke-width: 1.5;"></i>
                </button>
                <button class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                    <i data-lucide="user" class="w-5 h-5 text-white/60" style="stroke-width: 1.5;"></i>
                </button>
            </div>
        </div>

        <!-- Right Card - TROPICAL LANDS -->
        <div class="glass-strong rounded-3xl w-[420px] shadow-2xl overflow-hidden" style="box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);">
            <!-- Header -->
            <div class="p-8 pb-4">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl glass flex items-center justify-center">
                            <i data-lucide="compass" class="w-5 h-5 text-white" style="stroke-width: 1.5;"></i>
                        </div>
                        <div>
                            <div class="text-white text-sm font-medium tracking-wide">TROPICAL LANDS</div>
                        </div>
                    </div>
                    <button class="w-10 h-10 rounded-xl glass flex items-center justify-center hover:bg-white/20 transition-colors">
                        <i data-lucide="sliders-horizontal" class="w-5 h-5 text-white" style="stroke-width: 1.5;"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2 text-white/60 text-xs">
                    <i data-lucide="map-pin" class="w-3 h-3" style="stroke-width: 1.5;"></i>
                    <span>OAHU</span>
                    <span>CHILE</span>
                    <span>USA</span>
                    <span>TTONGGG</span>
                </div>
            </div>

            <!-- Mountain Illustration -->
            <div class="relative px-8 pb-8">
                <div class="glass rounded-3xl overflow-hidden relative" style="height: 440px;">
                    <!-- Sky with gradient -->
                    <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(250, 240, 230, 0.5) 0%, rgba(255, 220, 210, 0.6) 30%, rgba(255, 200, 200, 0.7) 60%, rgba(240, 180, 190, 0.8) 100%);">
                        <!-- Clouds -->
                        <div class="cloud absolute top-12 left-16 w-20 h-8 rounded-full opacity-40" style="background: rgba(255, 255, 255, 0.6); box-shadow: 30px 0 0 -5px rgba(255, 255, 255, 0.6), 50px 0 0 -8px rgba(255, 255, 255, 0.6);"></div>
                        <div class="cloud absolute top-8 right-20 w-24 h-9 rounded-full opacity-35" style="background: rgba(255, 255, 255, 0.5); box-shadow: 35px 0 0 -6px rgba(255, 255, 255, 0.5), 60px 0 0 -10px rgba(255, 255, 255, 0.5); animation-delay: -8s;"></div>
                        <div class="cloud absolute top-24 left-32 w-16 h-7 rounded-full opacity-30" style="background: rgba(255, 255, 255, 0.4); box-shadow: 25px 0 0 -4px rgba(255, 255, 255, 0.4); animation-delay: -15s;"></div>

                        <!-- Sun/Moon circle -->
                        <div class="absolute top-16 right-16 w-20 h-20 rounded-full opacity-70" style="background: radial-gradient(circle, rgba(255, 240, 200, 0.8) 0%, rgba(255, 220, 180, 0.6) 50%, transparent 70%);"></div>
                    </div>

                    <!-- Back Mountains -->
                    <div class="absolute bottom-0 left-0 right-0">
                        <svg viewBox="0 0 400 300" class="w-full" style="height: 380px;">
                            <!-- Far back mountain -->
                            <path d="M 0 280 L 80 200 L 160 280 Z" fill="url(#mountain-far)" opacity="0.4"/>

                            <!-- Middle mountains -->
                            <path d="M 60 280 L 140 180 L 220 280 Z" fill="url(#mountain-mid)" opacity="0.5"/>

                            <!-- Front left mountain -->
                            <path d="M -20 280 L 100 120 Q 110 115 120 120 L 180 200 L 240 280 Z" fill="url(#mountain-front-left)"/>

                            <!-- Front right mountain (tallest) -->
                            <path d="M 180 280 L 280 60 Q 290 55 300 60 L 350 140 L 420 280 Z" fill="url(#mountain-front-right)"/>

                            <!-- Define gradients -->
                            <defs>
                                <linearGradient id="mountain-far" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:rgba(200, 160, 180, 0.5);stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:rgba(140, 100, 140, 0.6);stop-opacity:1" />
                                </linearGradient>
                                <linearGradient id="mountain-mid" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:rgba(220, 140, 170, 0.6);stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:rgba(160, 80, 130, 0.7);stop-opacity:1" />
                                </linearGradient>
                                <linearGradient id="mountain-front-left" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:rgba(255, 200, 180, 0.7);stop-opacity:1" />
                                    <stop offset="40%" style="stop-color:rgba(240, 160, 170, 0.75);stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:rgba(180, 100, 140, 0.8);stop-opacity:1" />
                                </linearGradient>
                                <linearGradient id="mountain-front-right" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" style="stop-color:rgba(255, 220, 200, 0.8);stop-opacity:1" />
                                    <stop offset="30%" style="stop-color:rgba(250, 180, 190, 0.85);stop-opacity:1" />
                                    <stop offset="70%" style="stop-color:rgba(200, 120, 160, 0.9);stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:rgba(140, 60, 120, 0.95);stop-opacity:1" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <!-- Base/Ground -->
                    <div class="absolute bottom-0 left-0 right-0 h-24 rounded-b-3xl" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(240, 220, 230, 0.5) 100%);"></div>
                </div>
            </div>

            <!-- Stats at bottom -->
            <div class="px-8 pb-8">
                <div class="glass rounded-2xl p-5">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-400 to-pink-400"></div>
                            <div>
                                <div class="text-white text-sm font-medium">Chen Pomlaphy</div>
                                <div class="flex items-center gap-2 mt-1">
                                    <div class="flex gap-1">
                                        <div class="w-6 h-1.5 rounded-full bg-red-400"></div>
                                        <div class="w-6 h-1.5 rounded-full bg-purple-400"></div>
                                        <div class="w-6 h-1.5 rounded-full bg-orange-300"></div>
                                        <div class="w-6 h-1.5 rounded-full bg-pink-300"></div>
                                        <div class="w-6 h-1.5 rounded-full bg-purple-300"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-white text-xs mb-1 flex items-center justify-end gap-1">
                                <i data-lucide="dollar-sign" class="w-3 h-3" style="stroke-width: 1.5;"></i>
                                <span class="font-semibold">$120</span>
                                <i data-lucide="circle" class="w-1 h-1 fill-white/60" style="stroke-width: 0;"></i>
                            </div>
                            <div class="flex gap-2 text-white/60 text-xs">
                                <span class="flex items-center gap-1">
                                    <i data-lucide="user" class="w-3 h-3" style="stroke-width: 1.5;"></i>
                                    MASTER
                                </span>
                                <span class="flex items-center gap-1">
                                    <i data-lucide="droplet" class="w-3 h-3" style="stroke-width: 1.5;"></i>
                                    HARD
                                </span>
                                <span class="flex items-center gap-1">
                                    SCORE
                                    <span class="text-white">34326</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="grid grid-cols-3 gap-3 mt-4">
                    <button class="glass rounded-xl px-4 py-3 hover:bg-white/25 transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4 text-white/80" style="stroke-width: 1.5;"></i>
                        <span class="text-white/80 text-xs font-medium">WHEN AFTEE LIMITS</span>
                    </button>
                    <button class="glass rounded-xl px-4 py-3 hover:bg-white/25 transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="check" class="w-4 h-4 text-white/80" style="stroke-width: 1.5;"></i>
                        <span class="text-white/80 text-xs font-medium">DIEM</span>
                    </button>
                    <button class="glass rounded-xl px-4 py-3 hover:bg-white/25 transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="triangle" class="w-4 h-4 text-white/80" style="stroke-width: 1.5;"></i>
                        <span class="text-white/80 text-xs font-medium">VINCULUS ENCOUNTER EANTE</span>
                    </button>
                </div>

                <!-- Bottom action button -->
                <button class="w-full glass rounded-2xl py-4 mt-4 hover:bg-white/25 transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="activity" class="w-5 h-5 text-white" style="stroke-width: 1.5;"></i>
                    <span class="text-white font-medium tracking-tight">WTFLEY</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
