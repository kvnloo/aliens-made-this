<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nature Mobile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;gap:2.2vw;
  padding:3vh 2vw;background:linear-gradient(160deg,#2a1830,#e8a040);font-family:Inter,system-ui,sans-serif;overflow:hidden;
}
.phone{
  height:min(92vh, 880px);aspect-ratio:9/19;max-width:46vw;
  border-radius:clamp(22px,3vw,36px);padding:clamp(6px,0.8vw,10px);
  background:#111;box-shadow:0 24px 60px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.1);
  border:none;cursor:pointer;position:relative;display:flex;padding:7px;
  transition:transform .15s;
}
.phone:hover{transform:translateY(-4px)}
.phone:focus-visible,.phone.active{outline:2px solid #7dffb3;outline-offset:3px}
.screen{
  flex:1;border-radius:clamp(16px,2.2vw,28px);overflow:hidden;
  background:center/cover no-repeat #000;position:relative;
}
.L .screen{background-image:url('../inspo/crops/nature_L.jpg')}
.R .screen{background-image:url('../inspo/crops/nature_R.jpg')}
.bar{
  position:absolute;left:8%;right:8%;bottom:4%;height:4.5%;
  display:flex;gap:6px;opacity:0;transition:opacity .15s;
}
.phone:hover .bar,.phone.active .bar{opacity:1}
.bar button{
  flex:1;border:0;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;
  font-size:10px;font-weight:600;backdrop-filter:blur(6px);cursor:pointer;
}
.bar button:hover{background:rgba(125,255,179,.35)}
#st{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;
  color:#fff;background:rgba(0,0,0,.4);padding:5px 10px;border-radius:999px;z-index:5}
</style>
</head>
<body>
<button type="button" class="phone L" data-s="left" aria-label="left"><div class="screen"><div class="bar"><button type="button" data-a="back">Back</button><button type="button" data-a="go">Open</button></div></div></button>
<button type="button" class="phone R" data-s="right" aria-label="right"><div class="screen"><div class="bar"><button type="button" data-a="back">Back</button><button type="button" data-a="go">Open</button></div></div></button>
<div id="st">hybrid dual-phone · click to select</div>
<script>
const st=document.getElementById('st');
document.querySelectorAll('.phone').forEach(p=>{
  p.addEventListener('click',e=>{
    if(e.target.closest('.bar button'))return;
    document.querySelectorAll('.phone').forEach(x=>x.classList.remove('active'));
    p.classList.add('active'); st.textContent='selected · '+p.dataset.s;
  });
});
document.querySelectorAll('.bar button').forEach(b=>b.addEventListener('click',e=>{
  e.stopPropagation();
  st.textContent=e.target.dataset.a+' · '+e.target.closest('.phone').dataset.s;
}));
</script>
</body>
</html>
