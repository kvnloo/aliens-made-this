<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhigyan — Laledo / Laloch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    /* Studio: violet left → peach/coral right (DOM gradient, not inspo wallpaper) */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 75% 110% at 0% 48%, rgba(130, 70, 210, 0.72) 0%, transparent 58%),
        radial-gradient(ellipse 70% 100% at 100% 50%, rgba(255, 175, 145, 0.78) 0%, transparent 55%),
        linear-gradient(105deg,
          #5C3A9E 0%, #6B45A0 12%, #85559A 28%,
          #B0708C 46%, #D89888 62%, #EFB0A0 78%, #F6C4B0 100%);
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      transform: scale(0.88);
      transform-origin: center center;
    }

    .phone {
      width: 320px;
      height: 690px;
      background: #05060a;
      border-radius: 46px;
      padding: 8px;
      box-shadow:
        0 40px 90px rgba(40, 10, 55, 0.55),
        0 14px 32px rgba(0, 0, 0, 0.38),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.08);
      position: relative;
      flex-shrink: 0;
    }

    .screen {
      width: 100%; height: 100%;
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      background: #081022;
    }
    .screen-left {
      background:
        radial-gradient(ellipse 120% 50% at 50% 16%, rgba(60, 80, 150, 0.38) 0%, transparent 62%),
        radial-gradient(ellipse 70% 35% at 78% 55%, rgba(40, 55, 110, 0.22) 0%, transparent 58%),
        linear-gradient(180deg, #0c1830 0%, #091426 42%, #070f1c 100%);
    }
    .screen-right {
      background:
        radial-gradient(ellipse 100% 46% at 50% 14%, rgba(50, 80, 145, 0.36) 0%, transparent 64%),
        linear-gradient(180deg, #0c1830 0%, #091426 42%, #070f1c 100%);
    }

    .notch {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 108px; height: 26px;
      background: #05060a;
      border-radius: 0 0 18px 18px;
      z-index: 60;
    }
    .notch::after {
      content: '';
      position: absolute;
      top: 8px; left: 50%; transform: translateX(-50%);
      width: 42px; height: 4px;
      background: #1a1e28;
      border-radius: 3px;
    }

    .status {
      position: relative; z-index: 50;
      height: 36px;
      padding: 11px 20px 0;
      display: flex; justify-content: space-between; align-items: center;
      color: #fff; font-size: 12px; font-weight: 600;
    }
    .status-icons { display: flex; gap: 4px; align-items: center; opacity: 0.92; }

    .app-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 18px 0;
      position: relative; z-index: 20;
    }
    .app-name {
      font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.6px;
    }
    .app-bar-right {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 500;
    }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.55); cursor: pointer;
      border: none; background: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .stars { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .star { position: absolute; background: rgba(255,255,255,0.9); border-radius: 50%; }
    .star.sm { width: 1.3px; height: 1.3px; opacity: 0.35; }
    .star.md { width: 2.1px; height: 2.1px; opacity: 0.7; }
    .star.lg { width: 2.8px; height: 2.8px; opacity: 0.92; }
    .star.cross {
      width: 10px; height: 10px; background: transparent; opacity: 0.9;
    }
    .star.cross::before, .star.cross::after {
      content: ''; position: absolute;
      background: rgba(255, 230, 190, 0.95);
      border-radius: 1px;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .star.cross::before { width: 10px; height: 1.5px; }
    .star.cross::after { width: 1.5px; height: 10px; }
    .star.cross.cyan::before, .star.cross.cyan::after { background: rgba(170, 240, 255, 0.92); }

    /* LEFT planet hero — large centered peach globe */
    .planet-zone {
      position: relative;
      height: 268px;
      display: flex; align-items: center; justify-content: center;
      z-index: 5; margin-top: 6px;
    }
    .planet {
      width: 196px; height: 196px; border-radius: 50%;
      position: relative; z-index: 4;
      background:
        radial-gradient(circle at 32% 20%,
          #FFF8E8 0%, #FFE8B0 8%, #FFC878 18%,
          #FFA060 30%, #FF8A58 42%, #F06068 58%,
          #D04070 74%, #A83058 90%, #802040 100%);
      box-shadow:
        0 0 48px rgba(255, 100, 110, 0.58),
        0 0 96px rgba(255, 70, 120, 0.3),
        0 14px 30px rgba(0,0,0,0.42),
        inset -14px -16px 30px rgba(120, 15, 50, 0.48),
        inset 12px 12px 26px rgba(255,255,255,0.3);
      overflow: hidden; cursor: pointer;
      transition: transform 0.25s ease;
    }
    .planet:hover { transform: scale(1.03); }
    .planet-band {
      position: absolute; left: -12%; right: -12%; height: 52%; bottom: 0;
      background: linear-gradient(180deg,
        transparent 0%, rgba(255,120,80,0.12) 8%,
        rgba(170,35,65,0.55) 48%, rgba(120,20,50,0.94) 100%);
    }
    .planet-mountains {
      position: absolute; left: 0; right: 0; bottom: 4%; height: 52%; z-index: 2;
    }
    .planet-mountains svg { width: 100%; height: 100%; display: block; }
    .planet-chart {
      position: absolute; left: 8%; right: 8%; top: 20%; height: 46%; z-index: 3;
    }
    .planet-chart svg { width: 100%; height: 100%; overflow: visible; }

    .moon { position: absolute; border-radius: 50%; z-index: 6; }
    .moon-blue {
      width: 32px; height: 32px; right: 36px; bottom: 62px;
      background: radial-gradient(circle at 32% 28%, #C8F4FF 0%, #58B0F0 45%, #2468B0 100%);
      box-shadow: 0 0 20px rgba(90,180,240,0.7), 0 4px 10px rgba(0,0,0,0.3);
    }
    .moon-purple {
      width: 16px; height: 16px; left: 44px; bottom: 80px;
      background: radial-gradient(circle at 30% 28%, #E8D0FF 0%, #9070D8 50%, #5030A0 100%);
      box-shadow: 0 0 14px rgba(140,100,230,0.6);
    }
    .moon-tiny {
      width: 11px; height: 11px; right: 58px; top: 64px;
      background: radial-gradient(circle at 30% 28%, #FFF0B0, #E8A040);
      box-shadow: 0 0 12px rgba(255,200,80,0.7);
    }
    .moon-cyan-sm {
      width: 9px; height: 9px; left: 58px; top: 92px;
      background: radial-gradient(circle at 30% 28%, #B0F0FF, #40A0D8);
      box-shadow: 0 0 9px rgba(80,180,240,0.55);
    }

    .content-pad { padding: 0 14px; position: relative; z-index: 10; }

    .card {
      background: rgba(10, 22, 44, 0.82);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 11px 13px 10px;
      margin-bottom: 9px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 6px 22px rgba(0,0,0,0.25);
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .card:hover {
      border-color: rgba(255,255,255,0.18);
      background: rgba(16, 30, 54, 0.92);
    }
    .card-row { display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 13.5px; font-weight: 600; color: #fff; letter-spacing: -0.2px; }
    .card-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
    .meta-chip { font-size: 10px; color: rgba(255,255,255,0.32); }
    .pct { font-size: 10.5px; font-weight: 600; color: #FF7A9A; }
    .share-ico {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.4);
    }

    .dot-row { display: flex; gap: 10px; margin-top: 11px; }
    .ndot {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,0.32);
      cursor: pointer; border: none; transition: transform 0.15s;
    }
    .ndot:hover { transform: translateY(-2px); }
    .ndot.active { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 2px; }
    .dot-labels { display: flex; gap: 10px; margin-top: 4px; }
    .dot-labels span {
      width: 34px; text-align: center; font-size: 6.5px;
      color: rgba(255,255,255,0.34); font-weight: 500;
    }

    .bottom-nav {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 11px; z-index: 20;
    }
    .nav-orb {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      color: #fff; cursor: pointer; transition: transform 0.15s;
      border: none; padding: 0;
    }
    .nav-orb:hover { transform: scale(1.08); }
    .nav-orb.active {
      box-shadow: 0 0 0 2px rgba(255,255,255,0.38), 0 4px 14px rgba(0,0,0,0.35);
    }
    .nav-orb svg { width: 15px; height: 15px; }
    .nav-orb .n-num { font-size: 12px; font-weight: 700; color: #fff; }

    .home-bar {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 104px; height: 3.5px;
      background: rgba(255,255,255,0.3); border-radius: 4px; z-index: 30;
    }

    /* RIGHT metrics */
    .hero-zone {
      position: relative; height: 150px;
      display: flex; align-items: center; justify-content: center;
      z-index: 5; margin-top: 4px;
    }
    .orb-wrap { position: relative; width: 104px; height: 104px; }
    .orb {
      width: 104px; height: 104px; border-radius: 50%;
      background:
        radial-gradient(circle at 28% 22%,
          #F0FCFF 0%, #78D8F8 12%, #5898F0 30%,
          #7868D8 52%, #C870B8 74%, #F09098 100%);
      box-shadow:
        0 0 36px rgba(100,170,240,0.55),
        0 0 70px rgba(170,100,200,0.3),
        0 8px 24px rgba(0,0,0,0.36),
        inset -8px -10px 22px rgba(80,40,120,0.32),
        inset 8px 10px 18px rgba(255,255,255,0.26);
      position: relative; z-index: 4; cursor: pointer;
      transition: transform 0.25s; overflow: hidden;
    }
    .orb:hover { transform: scale(1.05); }
    .orb-inner-chart {
      position: absolute; inset: 16%; z-index: 2; opacity: 0.88;
    }
    .orb-inner-chart svg { width: 100%; height: 100%; overflow: visible; }

    .wave-layer {
      position: absolute; inset: -40px -60px; z-index: 2; pointer-events: none;
    }
    .wave-layer svg { width: 100%; height: 100%; overflow: visible; }

    .orb-sat {
      position: absolute; border-radius: 50%; z-index: 5;
    }
    .orb-sat.s1 {
      width: 14px; height: 14px; right: -6px; top: 14px;
      background: radial-gradient(circle at 30% 30%, #C0F8FF, #48A8E8);
      box-shadow: 0 0 12px rgba(80,180,240,0.75);
    }
    .orb-sat.s2 {
      width: 10px; height: 10px; left: -4px; bottom: 24px;
      background: radial-gradient(circle at 30% 30%, #FFE0A0, #E88840);
      box-shadow: 0 0 9px rgba(255,160,60,0.65);
    }
    .orb-sat.s3 {
      width: 8px; height: 8px; right: 14px; bottom: -2px;
      background: radial-gradient(circle at 30% 30%, #E0C0FF, #8860D0);
      box-shadow: 0 0 8px rgba(140,100,220,0.6);
    }

    .metric-block { padding: 0 18px; position: relative; z-index: 10; }
    .metric-row {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 2px;
    }
    .big-num {
      font-size: 36px; font-weight: 700; color: #fff;
      letter-spacing: -1.4px; line-height: 1;
    }
    .metric-sub {
      font-size: 9.5px; color: rgba(255,255,255,0.38); margin-top: 4px; font-weight: 500;
    }
    .side-metric { text-align: right; }
    .side-val {
      font-size: 15px; font-weight: 600; color: #F0A060; letter-spacing: -0.3px;
    }
    .side-label {
      font-size: 8.5px; color: rgba(255,255,255,0.32); margin-top: 2px;
    }

    .chip-row {
      display: flex; gap: 9px; margin: 14px 0 8px; justify-content: flex-start;
    }
    .chip {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      cursor: pointer; border: none; transition: transform 0.15s;
    }
    .chip:hover { transform: translateY(-2px); }
    .chip.active { outline: 2px solid rgba(255,255,255,0.48); outline-offset: 2px; }
    .chip-labels { display: flex; gap: 9px; margin-top: -2px; margin-bottom: 12px; }
    .chip-labels span {
      width: 34px; text-align: center; font-size: 6.5px;
      color: rgba(255,255,255,0.32); font-weight: 500;
    }

    .panel {
      background: rgba(8, 20, 40, 0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 13px;
      padding: 10px 12px;
      margin-bottom: 8px;
      backdrop-filter: blur(14px);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .panel:hover { border-color: rgba(255,255,255,0.15); }
    .panel-title {
      font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 8px;
    }
    .mini-chart { height: 46px; width: 100%; }
    .mini-chart svg { width: 100%; height: 100%; overflow: visible; }

    .line-list { display: flex; flex-direction: column; gap: 10px; }
    .line-item {
      display: flex; align-items: center; gap: 9px;
      font-size: 10.5px; color: rgba(255,255,255,0.52);
    }
    .line-bar {
      flex: 1; height: 2.5px; border-radius: 2px;
      background: rgba(255,255,255,0.07); overflow: hidden;
    }
    .line-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #F09060, #E86090);
    }
    .line-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- LEFT: Laledo -->
    <div class="phone" data-phone="left">
      <div class="screen screen-left">
        <div class="notch"></div>
        <div class="stars" id="stars-l"></div>

        <div class="status">
          <span>9:41</span>
          <div class="status-icons">
            <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><rect x="0" y="3" width="3" height="8" rx="0.5" fill="#fff"/><rect x="4" y="2" width="3" height="9" rx="0.5" fill="#fff"/><rect x="8" y="0.5" width="3" height="10.5" rx="0.5" fill="#fff"/><rect x="12" y="0" width="3" height="11" rx="0.5" fill="rgba(255,255,255,0.35)"/></svg>
            <svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M1 7.5C2.5 5.5 5 4 7 4s4.5 1.5 6 3.5" stroke="#fff" stroke-width="1.2" fill="none"/><path d="M3 9c1.2-1.2 2.8-1.8 4-1.8S9.8 7.8 11 9" stroke="#fff" stroke-width="1.2" fill="none"/><circle cx="7" cy="10" r="1" fill="#fff"/></svg>
            <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="0.5" y="1" width="18" height="9" rx="2" stroke="#fff" stroke-width="1"/><rect x="2" y="2.5" width="13" height="6" rx="1" fill="#fff"/><path d="M19.5 3.5v4c1 .4 1 .4 1-2s0-2.4-1-2z" fill="rgba(255,255,255,0.5)"/></svg>
          </div>
        </div>

        <div class="app-bar">
          <div class="app-name">Laledo</div>
          <div class="app-bar-right">
            <span>Aurora</span>
            <button class="icon-btn" aria-label="share" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </button>
          </div>
        </div>

        <div class="planet-zone">
          <div class="moon moon-cyan-sm"></div>
          <div class="moon moon-tiny"></div>
          <div class="moon moon-purple"></div>
          <div class="moon moon-blue"></div>
          <div class="planet" id="planet" role="button" tabindex="0" aria-label="Planet hero">
            <div class="planet-band"></div>
            <div class="planet-mountains">
              <svg viewBox="0 0 200 100" preserveAspectRatio="none">
                <path d="M0 80 L28 52 L52 66 L78 38 L108 60 L138 32 L168 56 L200 46 L200 100 L0 100 Z" fill="rgba(110,25,50,0.58)"/>
                <path d="M0 88 L38 64 L68 76 L98 50 L132 70 L162 48 L200 64 L200 100 L0 100 Z" fill="rgba(85,18,42,0.72)"/>
              </svg>
            </div>
            <div class="planet-chart">
              <svg viewBox="0 0 100 50" preserveAspectRatio="none">
                <polyline points="0,38 12,32 22,36 35,22 48,28 58,14 70,20 82,10 95,16 100,12"
                  fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="0,42 15,36 28,40 42,30 55,34 68,24 80,28 92,20 100,22"
                  fill="none" stroke="rgba(255,200,160,0.5)" stroke-width="1.15" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="content-pad">
          <div class="card" data-card="flux">
            <div class="card-row">
              <div class="card-title">Fluxion Lode</div>
              <div class="share-ico">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              </div>
            </div>
          </div>
          <div class="card" data-card="low">
            <div class="card-row">
              <div>
                <div class="card-title" style="font-size:12.5px">Lowrick Dorgean</div>
                <div class="card-meta">
                  <span class="meta-chip">Babrorn · 11m</span>
                  <span class="pct">+12.4%</span>
                </div>
              </div>
              <div class="share-ico">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
              </div>
            </div>
            <div class="dot-row" id="left-dots">
              <button class="ndot active" style="background:linear-gradient(145deg,#4A9EF0,#2A6AD0)" type="button">1</button>
              <button class="ndot" style="background:linear-gradient(145deg,#F0A040,#E07030)" type="button">2</button>
              <button class="ndot" style="background:linear-gradient(145deg,#C060E8,#8030C0)" type="button">3</button>
              <button class="ndot" style="background:linear-gradient(145deg,#40C888,#28A060)" type="button">2</button>
              <button class="ndot" style="background:linear-gradient(145deg,#F07050,#D04040)" type="button">4</button>
            </div>
            <div class="dot-labels">
              <span>Devits</span><span>Avotex</span><span>Belbe</span><span>Vywix</span><span>Kofix</span>
            </div>
          </div>
        </div>

        <div class="bottom-nav" id="nav-left">
          <button class="nav-orb active" style="background:linear-gradient(145deg,#5AA8F0,#3060C8)" type="button" aria-label="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
          </button>
          <button class="nav-orb" style="background:linear-gradient(145deg,#F0A050,#E06030)" type="button" aria-label="chart">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-7M22 19V8"/></svg>
          </button>
          <button class="nav-orb" style="background:linear-gradient(145deg,#C070E8,#8040C0)" type="button" aria-label="star">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>
          </button>
          <button class="nav-orb" style="background:linear-gradient(145deg,#48C888,#28A060)" type="button" aria-label="pulse">

  <script>
    function sprinkle(id, n) {
      const root = document.getElementById(id);
      if (!root) return;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div');
        const r = Math.random();
        if (r > 0.94) {
          s.className = 'star cross' + (Math.random() > 0.5 ? ' cyan' : '');
        } else if (r > 0.75) {
          s.className = 'star lg';
        } else if (r > 0.4) {
          s.className = 'star md';
        } else {
          s.className = 'star sm';
        }
        s.style.left = (Math.random() * 100) + '%';
        s.style.top = (Math.random() * 100) + '%';
        frag.appendChild(s);
      }
      root.appendChild(frag);
    }
    sprinkle('stars-l', 52);
    sprinkle('stars-r', 46);

    function bindNav(id) {
      const nav = document.getElementById(id);
      if (!nav) return;
      nav.querySelectorAll('.nav-orb').forEach(btn => {
        btn.addEventListener('click', () => {
          nav.querySelectorAll('.nav-orb').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    }
    bindNav('nav-left');
    bindNav('nav-right');

    document.getElementById('left-dots')?.querySelectorAll('.ndot').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        document.querySelectorAll('#left-dots .ndot').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
    document.getElementById('right-chips')?.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#right-chips .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.getElementById('planet')?.addEventListener('click', () => {
      const p = document.getElementById('planet');
      p.style.transform = 'scale(1.06)';
      setTimeout(() => { p.style.transform = ''; }, 220);
    });
    document.getElementById('orb')?.addEventListener('click', () => {
      const o = document.getElementById('orb');
      o.style.transform = 'scale(1.08)';
      setTimeout(() => { o.style.transform = ''; }, 220);
    });
  </script>
