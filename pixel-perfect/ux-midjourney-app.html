<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEZZ2D Pizza App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;font-family:Inter,system-ui,sans-serif;
      background:#f0e0c8;display:flex;align-items:center;justify-content:center;
      padding:24px 12px;flex-direction:column;gap:16px;
    }
    .stage{
      position:relative;width:min(1100px,96vw);aspect-ratio:1;
      max-height:78vh;border-radius:16px;overflow:hidden;
      box-shadow:0 32px 80px rgba(0,0,0,.4);
      background:#111;
    }
    .stage img.hero{
      width:100%;height:100%;object-fit:cover;object-position:center;display:block;
    }
    .dock{
      display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:96vw;
    }
    .dock button{
      padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);
      background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:600;
      cursor:pointer;backdrop-filter:blur(10px);
    }
    .dock button:hover,.dock button.on{background:rgba(125,255,179,.2);border-color:#7dffb3;color:#7dffb3}
    .toast{
      position:fixed;top:16px;left:50%;transform:translateX(-50%);
      background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:10px;
      font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;
    }
    .toast.show{opacity:1}
    .hotspot{
      position:absolute;border:1px dashed rgba(125,255,179,.5);border-radius:12px;
      background:rgba(125,255,179,.08);cursor:pointer;
    }
    .hotspot:hover{background:rgba(125,255,179,.18)}
    .badge{
      position:absolute;bottom:10px;left:10px;font-size:10px;letter-spacing:.1em;
      text-transform:uppercase;color:rgba(255,255,255,.85);background:rgba(0,0,0,.4);
      padding:5px 8px;border-radius:999px;z-index:2;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div class="stage" id="stage">
    <img class="hero" src="../inspo/UX-Design-Midjourney-008-980x980.jpg" alt="PEZZ2D Pizza App inspiration composition" />
    <button type="button" class="hotspot" style="left:8%;top:12%;width:28%;height:22%" data-label="Primary panel" aria-label="Primary panel"></button>
    <button type="button" class="hotspot" style="right:8%;top:18%;width:24%;height:30%" data-label="Secondary panel" aria-label="Secondary panel"></button>
    <button type="button" class="hotspot" style="left:12%;bottom:14%;width:36%;height:18%" data-label="Bottom content" aria-label="Bottom content"></button>
    <span class="badge">hybrid · inspo stage + interactive hotspots</span>
  </div>
  <div class="dock">
    <button type="button" data-act="zoom">Focus hero</button>
    <button type="button" data-act="compare">Open raw inspo</button>
    <button type="button" data-act="reset">Reset</button>
  </div>
  <script>
    const toast = document.getElementById('toast');
    const stage = document.getElementById('stage');
    const hero = stage.querySelector('.hero');
    function tip(msg){ toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 1400); }
    stage.querySelectorAll('.hotspot').forEach(h => h.addEventListener('click', () => tip(h.dataset.label)));
    document.querySelectorAll('.dock button').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.dock button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      if (b.dataset.act==='zoom'){ hero.style.objectFit='contain'; tip('Contain mode'); }
      else if (b.dataset.act==='reset'){ hero.style.objectFit='cover'; tip('Cover mode'); }
      else if (b.dataset.act==='compare'){ window.open(hero.src,'_blank'); }
    }));
  </script>
</body>
</html>
